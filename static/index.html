<script type="module">
  // The main app script below is type="text/babel" (in-browser JSX
  // transform, no bundler) and can't use `import` directly, so this
  // loads CodeMirror 6 as real ES modules and hands the pieces off via
  // a single ready-promise on window that the Editor component awaits.
  // Hand-picked subpackages rather than the "codemirror" convenience
  // bundle: that package's default export came back as a plain
  // function (not the expected extensions array) through this CDN, and
  // basicSetup's search panel / fold gutter / lint gutter don't apply
  // to a kid-facing turtle-graphics editor anyway.
  window.__cmReady = (async () => {
    const { EditorView, keymap, lineNumbers, drawSelection, placeholder } = await import("https://esm.sh/@codemirror/view@6");
    const { defaultKeymap, history, historyKeymap, indentWithTab } = await import("https://esm.sh/@codemirror/commands@6");
    const { python } = await import("https://esm.sh/@codemirror/lang-python@6");
    const { autocompletion, acceptCompletion, closeBrackets, closeBracketsKeymap, completionKeymap } = await import("https://esm.sh/@codemirror/autocomplete@6");
    const { syntaxHighlighting, defaultHighlightStyle, HighlightStyle } = await import("https://esm.sh/@codemirror/language@6");
    const { tags } = await import("https://esm.sh/@lezer/highlight@1");
    return { EditorView, keymap, lineNumbers, drawSelection, placeholder,
             defaultKeymap, history, historyKeymap, indentWithTab, python,
             autocompletion, acceptCompletion, closeBrackets, closeBracketsKeymap, completionKeymap,
             syntaxHighlighting, defaultHighlightStyle, HighlightStyle, tags };
  })();
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;

// ---------- storage: talks to the Flask+SQLite backend over the API ----------
const API = "/api";

// Auth is a session cookie now (HttpOnly, set by the server on
// login/OAuth callback) -- fetch's default credentials mode already
// sends it on every same-origin request, so no per-call auth plumbing
// is needed here anymore (contrast with the old X-Parent-Pin header
// this used to attach by hand on every mutating call).
async function apiGet(path) {
  const res = await fetch(API + path);
  if (!res.ok) throw new Error("GET " + path + " failed (" + res.status + ")");
  return res.json();
}
async function apiPost(path, body) {
  const res = await fetch(API + path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("POST " + path + " failed (" + res.status + ")");
  return res.json();
}
async function apiPatch(path, body) {
  const res = await fetch(API + path, {
    method: "PATCH",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("PATCH " + path + " failed (" + res.status + ")");
  return res.json();
}
async function apiPut(path, body) {
  const res = await fetch(API + path, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("PUT " + path + " failed (" + res.status + ")");
  return res.json();
}
async function apiDelete(path) {
  const res = await fetch(API + path, { method: "DELETE" });
  if (!res.ok) throw new Error("DELETE " + path + " failed (" + res.status + ")");
  return res.json();
}

// ---------- in-browser Python execution (Skulpt) ----------
function skulptBuiltinRead(x) {
  if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
    throw "File not found: '" + x + "'";
  }
  return Sk.builtinFiles["files"][x];
}

// Runs `code` with turtle output drawn into the element with id `targetId`.
// Clears any previous drawing first (Skulpt stacks a new canvas into the
// target on every run otherwise) and focuses the target afterward so
// keyboard-driven turtle programs (onkey) work without an extra click —
// same as a real turtle/tkinter window needing focus.
async function runPython(code, targetId, onOutput) {
  const target = document.getElementById(targetId);
  target.innerHTML = "";
  Sk.configure({
    output: onOutput,
    read: skulptBuiltinRead,
    __future__: Sk.python3,
    // Turtle animates movement over real time by default (that's the
    // charm of it) — a correct program with a lot of drawing (nested
    // loops, many shapes) can legitimately take a while to finish
    // animating, so this needs real headroom, not just enough to catch
    // a true infinite loop.
    execLimit: 30000,
    yieldLimit: 200,
  });
  // Skulpt defaults TurtleGraphics to a fixed 400x400 canvas regardless
  // of the target div's actual size -- on this layout (a responsive,
  // wider-than-400 "Your drawing" box) that left a dead zone of plain
  // white div background past x=400 that LOOKS like canvas but isn't;
  // turtle motion past that edge just clips instead of drawing there.
  // Reading the live box size (innerHTML was just cleared above, so
  // this reflects pure CSS sizing, not a leftover canvas) makes the
  // canvas fill exactly what the kid can see, on any viewport.
  const tg = (Sk.TurtleGraphics || (Sk.TurtleGraphics = {}));
  tg.target = targetId;
  tg.width = target.clientWidth;
  tg.height = target.clientHeight;
  return Sk.misceval.asyncToPromise(function () {
    return Sk.importMainWithBody("<stdin>", false, code, true);
  }).then(
    function () {
      target.focus();
      return { ok: true };
    },
    function (err) {
      target.focus();
      return { ok: false, error: err.toString() };
    }
  );
}

// Skulpt's turtle module renders on two stacked canvases inside the
// target div, not one: a permanent "drawing" layer (the actual lines/
// shapes, lower z-index) and a "turtle sprite" layer redrawn every
// frame to show just the cursor icon (higher z-index, appended after
// the first). document.querySelector(...) grabbing the first canvas
// in DOM order was silently capturing only the near-blank sprite layer
// — every saved snapshot was just a turtle icon on white, no drawing.
// Composites every canvas in the target in z-index order (not hardcoded
// to "index 1 is always the drawing layer") so the snapshot matches
// exactly what's visually on screen, turtle icon included.
function captureCanvasSnapshot(targetId) {
  const canvases = Array.from(document.querySelectorAll("#" + targetId + " canvas"));
  if (canvases.length === 0) return null;
  if (canvases.length === 1) return canvases[0].toDataURL("image/png");
  const ordered = canvases.slice().sort((a, b) => (parseInt(a.style.zIndex) || 0) - (parseInt(b.style.zIndex) || 0));
  const out = document.createElement("canvas");
  out.width = ordered[0].width;
  out.height = ordered[0].height;
  const ctx = out.getContext("2d");
  ordered.forEach(c => ctx.drawImage(c, 0, 0));
  return out.toDataURL("image/png");
}

// Line-by-line output comparison that's exact for text but tolerant of
// equivalent numeric formatting -- e.g. a kid using float(input())
// instead of int(input()) prints "8.0" for an answer of 8, which is
// mathematically correct and shouldn't fail just because int() wasn't
// what was expected. Only kicks in when BOTH lines parse cleanly as
// numbers; "Fizz" vs "fizz" (or any other non-numeric line) still
// falls through to an exact string match, so case/spelling still count
// everywhere that isn't a bare number.
function judgeOutputsMatch(actual, expected) {
  const actualLines = actual.split("\n");
  const expectedLines = expected.split("\n");
  if (actualLines.length !== expectedLines.length) return false;
  return actualLines.every((line, i) => {
    const a = line.trim();
    const e = expectedLines[i].trim();
    if (a !== "" && e !== "" && Number.isFinite(Number(a)) && Number.isFinite(Number(e))) {
      return Number(a) === Number(e);
    }
    return a === e;
  });
}

// Runs `code` once per test case against a scripted input() feed (no
// live prompt UI -- Sk.configure's inputfun just hands input() the
// next canned value) and diffs the captured print() output against
// each case's expected string. Separate from runPython: judge tasks
// need multiple short runs with different inputs and a fully-captured
// result per run, not one long stream to a live canvas -- there's no
// canvas at all here, Sk.TurtleGraphics is never touched.
// Each test case runs independently (one crashing doesn't stop the
// rest) so a kid gets real per-case diagnostic signal, not just one
// pass/fail for the whole submission.
async function runJudgeTestCases(code, testCases) {
  const results = [];
  for (const tc of testCases) {
    let out = "";
    let idx = 0;
    try {
      Sk.configure({
        output: (text) => { out += text; },
        read: skulptBuiltinRead,
        __future__: Sk.python3,
        inputfun: () => tc.input[idx++],
        inputfunTakesPrompt: true,
        // Short on purpose -- judge tasks are small, fast problems, not
        // turtle's real-time animation. (A Skulpt platform quirk found
        // while building this vehicle also means graded test cases must
        // stay well clear of heavy naive-recursion call counts: past
        // roughly a few hundred thousand calls Skulpt doesn't cleanly
        // time out, it silently returns no output at all -- so this
        // execLimit is a backstop for a true infinite loop, not the
        // primary safety net for a slow-but-finite solution.)
        execLimit: 5000,
        yieldLimit: 200,
      });
      await Sk.misceval.asyncToPromise(() =>
        Sk.importMainWithBody("<stdin>", false, code, true));
      const actual = out.trim();
      const expected = tc.expected.trim();
      results.push({ input: tc.input, expected, actual, passed: judgeOutputsMatch(actual, expected) });
    } catch (err) {
      results.push({ input: tc.input, expected: tc.expected.trim(), actual: null,
                      error: err.toString(), passed: false });
    }
  }
  return results;
}

// Real completions via Pyodide + Jedi running in completion-worker.js (a
// module Worker -- required, not a style choice: Pyodide's loader
// rejects classic workers). Singleton, created lazily on first use so
// browsing Mission Control never triggers the ~12MB download; reused
// for the rest of the page session once started.
let completionWorker = null;
let completionRequestId = 0;
const pendingCompletions = new Map(); // id -> resolve fn

function getCompletionWorker() {
  if (!completionWorker) {
    completionWorker = new Worker("/completion-worker.js", { type: "module" });
    completionWorker.onmessage = (e) => {
      if (e.data.type === "complete-result") {
        const p = pendingCompletions.get(e.data.id);
        if (p) { p.resolve(e.data.completions); pendingCompletions.delete(e.data.id); }
      }
    };
  }
  return completionWorker;
}

// CM6 async completion source. Before Pyodide/Jedi finish their one-time
// warm-up, the worker just hasn't posted anything back yet -- no special
// loading state needed here, the request naturally waits.
async function jediCompletionSource(context) {
  const word = context.matchBefore(/\w*/);
  // Right after a bare "." (member access), matchBefore(/\w*/) matches an
  // EMPTY string at the cursor -- that's the single most important
  // trigger case (real IDEs show the full member list immediately after
  // typing "."), so it must NOT be treated as "nothing to complete".
  // Only bail out when there's neither a partial word nor a dot just
  // typed, and the request wasn't explicit (e.g. Ctrl+Space).
  const dotted = context.matchBefore(/\.\w*/);
  if (!dotted && (!word || (word.from == word.to && !context.explicit))) return null;
  const worker = getCompletionWorker();
  const line = context.state.doc.lineAt(context.pos);
  const id = ++completionRequestId;
  const completions = await new Promise((resolve) => {
    pendingCompletions.set(id, { resolve });
    worker.postMessage({
      type: "complete", id,
      source: context.state.doc.toString(),
      line: line.number, column: context.pos - line.from,
    });
  });
  // A newer keystroke superseded this request while it was in flight --
  // discard rather than pop in a suggestion list for text already moved past.
  if (id !== completionRequestId) return null;
  return { from: word.from, options: completions.map(([name, type, doc]) => ({ label: name, type, info: doc || undefined })) };
}

// A light, GitHub-style island inside the app's otherwise dark chrome --
// the surrounding page stays dark (GRID_BG, Panel, etc.), but the code
// itself gets a white background and GitHub's real syntax-highlighting
// palette (Primer's "prettylights" colors), since a single flat teal
// text color on dark slate was making several token types hard to tell
// apart. The bordered host div (see Editor below) frames the switch so
// it doesn't look like a stray white rectangle against the dark page.
function codeQuestTheme(CM) {
  // CM6 sizes to its content by default (unlike the old textarea's fixed
  // rows={12}) -- with one short line typed, it was collapsing down to
  // just that line. minHeight on both & and .cm-scroller keeps it a
  // proper, prominent editing area regardless of content; maxHeight +
  // scroll stops a very long program from growing the page unbounded.
  return CM.EditorView.theme({
    "&": { backgroundColor: "#ffffff", color: "#24292f", fontSize: "0.8rem", minHeight: "320px", maxHeight: "520px" },
    ".cm-content": { fontFamily: "ui-monospace, monospace", caretColor: "#0969da" },
    ".cm-gutters": { backgroundColor: "#f6f8fa", color: "#6e7781", border: "none" },
    ".cm-activeLine": { backgroundColor: "#f6f8fa" },
    ".cm-activeLineGutter": { backgroundColor: "#eaeef2" },
    ".cm-selectionBackground, &.cm-focused .cm-selectionBackground": { backgroundColor: "#b6e3ff !important" },
    "&.cm-focused": { outline: "none" },
    ".cm-scroller": { overflow: "auto", minHeight: "320px", maxHeight: "520px" },
  }, { dark: false });
}

// GitHub's actual light-mode syntax colors (Primer "prettylights"
// variables), mapped onto lezer's generic highlight tags -- not a
// vague approximation, the hex values are GitHub's own.
function githubHighlightStyle(CM) {
  const t = CM.tags;
  return CM.HighlightStyle.define([
    { tag: t.comment, color: "#6e7781", fontStyle: "italic" },
    { tag: t.string, color: "#0a3069" },
    { tag: [t.number, t.bool, t.null, t.atom], color: "#0550ae" },
    { tag: [t.keyword, t.controlKeyword, t.moduleKeyword, t.operatorKeyword], color: "#cf222e" },
    { tag: [t.definitionKeyword, t.definition(t.variableName), t.className], color: "#953800" },
    { tag: t.operator, color: "#cf222e" },
    { tag: [t.function(t.variableName), t.function(t.propertyName)], color: "#8250df" },
    { tag: t.propertyName, color: "#0550ae" },
    { tag: t.self, color: "#cf222e" },
    { tag: t.variableName, color: "#24292f" },
    { tag: t.punctuation, color: "#24292f" },
  ]);
}

// Wraps a CodeMirror 6 EditorView with the same external contract the
// old plain <textarea> had (value/onChange), plus onPasteDetected since
// paste is now audited rather than blocked (see SubmitModal). CM6 loads
// as real ES modules (window.__cmReady, set up in <head>) — this
// component just waits for that to resolve before constructing the view.
function Editor({ value, onChange, onPasteDetected }) {
  const hostRef = useRef(null);
  const viewRef = useRef(null);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    let cancelled = false;
    window.__cmReady.then((CM) => {
      if (cancelled) return;
      const view = new CM.EditorView({
        doc: value,
        selection: { anchor: value.length },
        extensions: [
          CM.lineNumbers(),
          CM.history(),
          CM.drawSelection(),
          CM.closeBrackets(),
          CM.python(),
          CM.syntaxHighlighting(githubHighlightStyle(CM)),
          CM.autocompletion({ override: [jediCompletionSource] }),
          // Tab is context-sensitive, matching every mainstream editor
          // (VS Code, PyCharm, Sublime): accepts the open suggestion if
          // there is one, otherwise falls through to indent.
          // completionKeymap itself only binds Enter to accept, not Tab
          // (confirmed by inspecting its actual bindings) -- without this
          // explicit entry ahead of indentWithTab, Tab always indents,
          // even with a completion popup open.
          CM.keymap.of([{ key: "Tab", run: CM.acceptCompletion }, CM.indentWithTab, ...CM.closeBracketsKeymap, ...CM.completionKeymap, ...CM.defaultKeymap, ...CM.historyKeymap]),
          CM.placeholder("import turtle\npen = turtle.Turtle()\n..."),
          CM.EditorView.domEventHandlers({ paste: () => { onPasteDetected(); } }),
          CM.EditorView.updateListener.of((update) => { if (update.docChanged) onChange(update.state.doc.toString()); }),
          CM.EditorView.contentAttributes.of({ spellcheck: "false", autocapitalize: "off", autocorrect: "off" }),
          codeQuestTheme(CM),
        ],
        parent: hostRef.current,
      });
      viewRef.current = view;
      setReady(true);
      view.focus(); // ready to keep typing immediately, no click needed first
    });
    return () => { cancelled = true; viewRef.current?.destroy(); };
    // eslint-disable-next-line
  }, []);

  // External resets (loading a saved draft, switching tasks) push into
  // CM imperatively — CM owns its own internal state after construction,
  // it doesn't re-read `value` on every render like a controlled input.
  useEffect(() => {
    const view = viewRef.current;
    if (view && value !== view.state.doc.toString()) {
      view.dispatch({ changes: { from: 0, to: view.state.doc.length, insert: value } });
    }
  }, [value, ready]);

  return (
    <div>
      {!ready && <div className="text-xs font-mono text-slate-500 p-3 border border-slate-600 rounded bg-slate-800">Loading editor…</div>}
      <div ref={hostRef} className={"rounded border border-slate-300 focus-within:border-teal-400 overflow-hidden " + (ready ? "" : "hidden")} />
    </div>
  );
}

// Downscales an uploaded photo to a small square-ish thumbnail before it
// ever becomes a data URL — kid avatars are shown at a few dozen px on
// the landing screen, and GET /api/kids loads before anyone's picked a
// kid, so an un-resized multi-MB phone photo would bloat that first
// fetch for no visual benefit.
function readImageAsResizedDataUrl(file, maxSize = 200) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// ---------- mystery-box (盲盒) task picker ----------
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function skillExposureCounts(kidTasks, kidSubmissions) {
  const submittedIds = new Set(kidSubmissions.map(s => s.taskId));
  const counts = {};
  kidTasks.filter(t => submittedIds.has(t.id)).forEach(t => {
    (t.skills || []).forEach(sk => { counts[sk] = (counts[sk] || 0) + 1; });
  });
  return counts;
}

const DIFFICULTY_ORDER = ["easy", "medium", "hard"];

// A kid's "current level" is the hardest difficulty they have an
// approved submission for — their proven ceiling, not just whatever
// they most recently attempted (a rejected hard attempt shouldn't count).
function currentDifficultyLevel(kidTasks, kidSubmissions) {
  const approvedIds = new Set(kidSubmissions.filter(s => s.status === "approved").map(s => s.taskId));
  const cleared = kidTasks.filter(t => approvedIds.has(t.id)).map(t => t.difficulty);
  if (cleared.length === 0) return "easy";
  return cleared.reduce((max, d) => DIFFICULTY_ORDER.indexOf(d) > DIFFICULTY_ORDER.indexOf(max) ? d : max, "easy");
}

function scoreTasks(tasks, counts) {
  return tasks.map(t => ({
    task: t,
    score: t.skills && t.skills.length ? Math.min(...t.skills.map(sk => counts[sk] || 0)) : 0.5,
  })).sort((a, b) => a.score - b.score);
}

// Skill-gap shortlist-then-shuffle, same idea curate_tasks.py uses to
// generate new tasks, applied here to rank ones that already exist.
function pickFromPool(pool, counts, excludeIds) {
  const candidates = pool.filter(t => !excludeIds.includes(t.id));
  const shortlist = scoreTasks(candidates, counts).slice(0, 6).map(s => s.task);
  return shuffle(shortlist)[0] || null;
}

// tier "current" pulls from the kid's proven-ceiling difficulty; tier
// "stretch" pulls from one difficulty above that. Falls back to any
// remaining available task (still skill-gap scored) if the target
// bucket is empty, so a box still fills whenever any task is left.
function pickOneForTier(tier, available, counts, level, excludeIds) {
  const nextLevel = DIFFICULTY_ORDER[Math.min(DIFFICULTY_ORDER.indexOf(level) + 1, DIFFICULTY_ORDER.length - 1)];
  const target = tier === "stretch" ? nextLevel : level;
  const bucket = available.filter(t => t.difficulty === target);
  return pickFromPool(bucket, counts, excludeIds) || pickFromPool(available, counts, excludeIds);
}

// Picks up to 3 tasks: 2 at the kid's current level, 1 stretch task one
// difficulty higher, favoring skills least represented in their
// submission history so far within each bucket.
function pickMysteryTasks(available, kidTasks, kidSubmissions, excludeIds = []) {
  const counts = skillExposureCounts(kidTasks, kidSubmissions);
  const level = currentDifficultyLevel(kidTasks, kidSubmissions);
  const used = excludeIds.slice();
  const boxes = [];
  for (const tier of ["current", "current", "stretch"]) {
    const task = pickOneForTier(tier, available, counts, level, used);
    if (!task) continue;
    boxes.push({ task, tier });
    used.push(task.id);
  }
  return boxes;
}

// In-progress code/explanation, so an accidental tab close doesn't lose
// work. Scoped per kid+task; cleared on a deliberate forfeit or submit,
// left alone otherwise (that's the whole point).
function draftKey(kidId, taskId) { return "codequest:draft:" + kidId + ":" + taskId; }
function loadDraft(kidId, taskId) {
  try { return JSON.parse(localStorage.getItem(draftKey(kidId, taskId))) || {}; } catch (e) { return {}; }
}
function saveDraft(kidId, taskId, draft) {
  try { localStorage.setItem(draftKey(kidId, taskId), JSON.stringify(draft)); } catch (e) {}
}
function clearDraft(kidId, taskId) {
  try { localStorage.removeItem(draftKey(kidId, taskId)); } catch (e) {}
}

const BOX_VARIANTS = [
  { lid: "#F5A623", body: "#B45309" },
  { lid: "#5EEAD4", body: "#0D9488" },
  { lid: "#F87171", body: "#B91C1C" },
  { lid: "#A78BFA", body: "#6D28D9" },
  { lid: "#60A5FA", body: "#1D4ED8" },
  { lid: "#FDE047", body: "#CA8A04" },
];

function MysteryBox({ variant, size = 88 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 100 100">
      <rect x="18" y="42" width="64" height="42" rx="4" fill={variant.body} />
      <rect x="14" y="30" width="72" height="16" rx="3" fill={variant.lid} />
      <rect x="44" y="30" width="12" height="54" fill={variant.body} opacity="0.85" />
      <rect x="14" y="36" width="72" height="6" fill={variant.body} opacity="0.85" />
      <text x="50" y="68" textAnchor="middle" fontSize="26" fontWeight="bold" fill="white" opacity="0.9">?</text>
    </svg>
  );
}

function MysteryBoxPicker({ kidId, available, kidTasks, kidSubmissions, onSubmit }) {
  const [boxes, setBoxes] = useState(() => pickMysteryTasks(available, kidTasks, kidSubmissions));
  const [variants, setVariants] = useState(() => shuffle(BOX_VARIANTS).slice(0, boxes.length));
  const [openedIndex, setOpenedIndex] = useState(null);
  const [activeTask, setActiveTask] = useState(null);
  const [explanation, setExplanation] = useState("");
  const [code, setCode] = useState("");
  // Whether a paste occurred anywhere in this task's editing session —
  // sticky (only ever set true, never un-set once flagged) until a fresh
  // startTask, forfeit, or submit resets it. Audited, not blocked.
  const [pasted, setPasted] = useState(false);
  // Task ids the kid has actively rerolled away this session. Exposure
  // counts don't change from a reroll (only a real submission moves
  // them), so without this the skill-gap shortlist stays identical
  // between rerolls and "Put It Back" just cycles the same handful of
  // tied-for-least-practiced tasks back into view. Excluding declined
  // ids forces genuinely new content until the whole pool's been seen.
  const [declinedIds, setDeclinedIds] = useState([]);

  // Among the active task's own tagged skills, the one the kid has the
  // least submission history for -- ties the tip to the code they're
  // actually about to write, not a generic "weakest skill overall".
  const activeTip = useMemo(() => {
    if (!activeTask || !activeTask.skills || !activeTask.skills.length) return null;
    const counts = skillExposureCounts(kidTasks, kidSubmissions);
    const weakest = activeTask.skills.reduce((min, sk) =>
      (counts[sk] || 0) < (counts[min] || 0) ? sk : min);
    return LIBRARY_TIPS[weakest] || null;
  }, [activeTask, kidTasks, kidSubmissions]);

  function rerollSlot(index) {
    const declinedTask = boxes[index].task;
    const shownIds = boxes.map(b => b.task.id);
    const counts = skillExposureCounts(kidTasks, kidSubmissions);
    const level = currentDifficultyLevel(kidTasks, kidSubmissions);
    const fullExclude = [...new Set([...shownIds, ...declinedIds, declinedTask.id])];
    let replacement = pickOneForTier(boxes[index].tier, available, counts, level, fullExclude);
    let nextDeclined = [...declinedIds, declinedTask.id];
    if (!replacement) {
      // Every eligible task has already been declined this session --
      // let them back into circulation rather than getting stuck
      // reshowing the exact box the kid just put back.
      replacement = pickOneForTier(boxes[index].tier, available, counts, level, shownIds);
      nextDeclined = [];
    }
    setDeclinedIds(nextDeclined);
    setBoxes(boxes.map((b, i) => (i === index ? { task: replacement || b.task, tier: b.tier } : b)));
    setVariants(prev => {
      const usedElsewhere = prev.filter((_, i) => i !== index);
      const fresh = shuffle(BOX_VARIANTS.filter(v => !usedElsewhere.includes(v)))[0] || shuffle(BOX_VARIANTS)[0];
      return prev.map((v, i) => (i === index ? fresh : v));
    });
    setOpenedIndex(null);
  }

  function startTask(task) {
    const draft = loadDraft(kidId, task.id);
    setExplanation(draft.explanation || "");
    setCode(draft.code || (task.vehicle === "judge" ? DEFAULT_CODE_JUDGE : DEFAULT_CODE_TURTLE));
    setPasted(draft.pasted || false);
    setActiveTask(task);
  }

  useEffect(() => {
    if (!activeTask) return;
    saveDraft(kidId, activeTask.id, { code, explanation, pasted });
  }, [code, explanation, pasted, activeTask, kidId]);

  if (boxes.length === 0 || !boxes.some(b => b.task)) {
    return <div className="text-slate-500 text-sm italic">All caught up — ask Dad for new tasks.</div>;
  }

  return (
    <div>
      <div className="grid grid-cols-3 gap-3">
        {boxes.map((b, i) => b.task && (
          <button key={b.task.id} onClick={() => setOpenedIndex(i)} disabled={openedIndex === i}
            className={"flex flex-col items-center gap-2 " + (openedIndex === i ? "opacity-40" : "hover:scale-105 transition-transform")}>
            <MysteryBox variant={variants[i] || BOX_VARIANTS[0]} />
            <span className="font-mono text-xs text-slate-500">MYSTERY QUEST</span>
          </button>
        ))}
      </div>

      {openedIndex !== null && boxes[openedIndex] && boxes[openedIndex].task && (
        <div className="mt-4">
          <Panel>
            {(() => {
              const task = boxes[openedIndex].task;
              const d = DIFFICULTY[task.difficulty];
              return (
                <>
                  <div className="flex items-start justify-between gap-3 mb-3">
                    <div>
                      <div className="font-semibold text-slate-100 mb-1">{task.title}</div>
                      <div className="text-sm text-slate-400 leading-snug">{task.brief}</div>
                    </div>
                    <div className="flex flex-col items-end gap-1 shrink-0">
                      <span className="font-mono text-xs px-1.5 py-0.5 rounded" style={{ color: d.color, border: "1px solid " + d.color + "55" }}>{d.label}</span>
                      <span className="font-mono text-teal-300 text-sm flex items-center gap-1"><IconStar size={12} />{task.points}</span>
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => startTask(task)}
                      className="flex-1 bg-teal-500 hover:bg-teal-400 text-slate-900 font-semibold rounded py-2 text-sm transition-colors">
                      Start This Quest
                    </button>
                    <button onClick={() => rerollSlot(openedIndex)}
                      className="px-3 py-2 rounded text-sm font-mono text-slate-400 hover:text-slate-200 border border-slate-600 flex items-center gap-1">
                      <IconRedo size={13} /> Put It Back
                    </button>
                  </div>
                </>
              );
            })()}
          </Panel>
        </div>
      )}

      {activeTask && (
        <SubmitModal task={activeTask} explanation={explanation} setExplanation={setExplanation}
          code={code} setCode={setCode} onPasteDetected={() => setPasted(true)} tip={activeTip}
          onSave={() => saveDraft(kidId, activeTask.id, { code, explanation, pasted })}
          onCancel={() => { clearDraft(kidId, activeTask.id); rerollSlot(openedIndex); setActiveTask(null); setExplanation(""); setCode(""); setPasted(false); }}
          onSubmit={(snapshot) => { clearDraft(kidId, activeTask.id); onSubmit(activeTask.id, explanation, code, snapshot, pasted); setActiveTask(null); setExplanation(""); setCode(""); setPasted(false); setOpenedIndex(null); }} />
      )}
    </div>
  );
}

// Fixed pedagogical order for the fundamentals set (simplest concept,
// and anything a later concept silently depends on, first -- e.g.
// type_casting right after variables, since every other numeric-input
// task quietly assumes int(input()) is already understood). Matches by
// each task's tagged skill, not by id -- every kid (whichever family,
// however their tasks got seeded) gets a freshly generated opaque task
// id with no shared naming convention to rely on, so skill is the only
// thing that reliably identifies "which fundamental is this."
const FUNDAMENTALS_ORDER = ["variables", "type_casting", "loops_basic", "lists", "functions", "parameters", "simple_math", "random_library"];

// Deliberately simpler than MysteryBoxPicker: a fixed small pool (not
// a large rotating one) needs no boxes, reroll, or skill-gap scoring --
// just a plain list straight into SubmitModal. No `tip` prop is passed
// (SubmitModal already renders nothing when tip is falsy) -- the whole
// point of this section is an unaided recall check, not a lookup.
function FundamentalsPractice({ kidId, tasks, onSubmit }) {
  const [activeTask, setActiveTask] = useState(null);
  const [explanation, setExplanation] = useState("");
  const [code, setCode] = useState("");
  const [pasted, setPasted] = useState(false);

  const isRecognized = t => t.skills && t.skills.some(sk => FUNDAMENTALS_ORDER.includes(sk));
  // flatMap (not map+find) -- a skill can now have several practice
  // questions, not just one, so every match for a skill shows up,
  // grouped together in FUNDAMENTALS_ORDER's order.
  const ordered = FUNDAMENTALS_ORDER
    .flatMap(skillId => tasks.filter(t => t.skills && t.skills.includes(skillId)))
    .concat(tasks.filter(t => !isRecognized(t)));

  function startTask(task) {
    const draft = loadDraft(kidId, task.id);
    setExplanation(draft.explanation || "");
    setCode(draft.code || DEFAULT_CODE_JUDGE);
    setPasted(draft.pasted || false);
    setActiveTask(task);
  }

  useEffect(() => {
    if (!activeTask) return;
    saveDraft(kidId, activeTask.id, { code, explanation, pasted });
  }, [code, explanation, pasted, activeTask, kidId]);

  return (
    <div>
      <div className="grid gap-2">
        {ordered.map(task => (
          <button key={task.id} onClick={() => startTask(task)}
            className="flex items-center justify-between border border-slate-700/50 hover:border-teal-300/60 rounded px-3 py-2 text-left transition-colors">
            <span className="text-sm text-slate-200">{task.title}</span>
            <span className="font-mono text-teal-300 text-xs flex items-center gap-1"><IconStar size={11} />{task.points}</span>
          </button>
        ))}
      </div>

      {activeTask && (
        <SubmitModal task={activeTask} explanation={explanation} setExplanation={setExplanation}
          code={code} setCode={setCode} onPasteDetected={() => setPasted(true)}
          onSave={() => saveDraft(kidId, activeTask.id, { code, explanation, pasted })}
          onCancel={() => { clearDraft(kidId, activeTask.id); setActiveTask(null); setExplanation(""); setCode(""); setPasted(false); }}
          onSubmit={(snapshot) => { clearDraft(kidId, activeTask.id); onSubmit(activeTask.id, explanation, code, snapshot, pasted); setActiveTask(null); setExplanation(""); setCode(""); setPasted(false); }} />
      )}
    </div>
  );
}

function App() {
  // authRole tracks the *server session*, not just local UI state --
  // set from GET /api/auth/me on mount (a real persistent cookie now,
  // unlike the old parentPin-in-memory/no-session model), and again
  // after a successful kid-login or Google OAuth callback redirect.
  const [authRole, setAuthRole] = useState(null); // null | "kid" | "parent"
  const [authChecked, setAuthChecked] = useState(false);
  const [familyName, setFamilyName] = useState(null);
  const [loading, setLoading] = useState(false);
  const [kids, setKids] = useState([]);
  const [selectedKid, setSelectedKid] = useState(null);
  const [tasks, setTasks] = useState([]);
  const [suggestions, setSuggestions] = useState([]);
  const [submissions, setSubmissions] = useState([]);
  const [redemptions, setRedemptions] = useState([]);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [team, setTeam] = useState(null);
  const [teamError, setTeamError] = useState(null);
  const [kidLoginError, setKidLoginError] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => { bootstrap(); }, []);

  // On first load (or right after the Google OAuth callback redirects
  // back to "/"), ask the server who -- if anyone -- this browser is
  // already logged in as, and load the right data for that role. A
  // fresh visit with no session just shows AuthLanding.
  async function bootstrap() {
    setLoading(true);
    setError(null);
    try {
      const me = await apiGet("/auth/me");
      setFamilyName(me.familyName || null);
      if (me.role === "kid") {
        setSelectedKid(me.kid);
        setAuthRole("kid");
        await loadKidData(me.kid.id);
      } else if (me.role === "parent") {
        setAuthRole("parent");
        await loadParentData();
      } else {
        setAuthRole(null);
      }
    } catch (e) {
      setError("Couldn't reach the server. Is app.py running? (" + e.message + ")");
    } finally {
      setAuthChecked(true);
      setLoading(false);
    }
  }

  async function loadKidData(kidId) {
    const [t, s, r, cfg, teamRes] = await Promise.all([
      apiGet("/tasks?kid=" + kidId), apiGet("/submissions?kid=" + kidId),
      apiGet("/redemptions?kid=" + kidId), apiGet("/settings"), apiGet("/teams/me"),
    ]);
    setTasks(t); setSubmissions(s); setRedemptions(r); setSettings(cfg);
    setTeam(teamRes.team);
  }

  async function refreshTeam() {
    const teamRes = await apiGet("/teams/me");
    setTeam(teamRes.team);
  }

  async function createTeam(name, goalPoints) {
    setTeamError(null);
    try {
      await apiPost("/teams", { name, goalPoints });
      await refreshTeam();
    } catch (e) {
      setTeamError("Couldn't create the team.");
    }
  }

  async function joinTeam(code) {
    setTeamError(null);
    try {
      const res = await fetch(API + "/teams/join", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code }),
      });
      const data = await res.json();
      if (!res.ok) {
        setTeamError(data.error === "unknown team code" ? "Never heard of that team code -- check the spelling?" : "Couldn't join that team.");
        return;
      }
      await refreshTeam();
    } catch (e) {
      setTeamError("Couldn't reach the server.");
    }
  }

  async function leaveTeam() {
    setTeamError(null);
    try {
      await apiPost("/teams/leave", {});
      await refreshTeam();
    } catch (e) {
      setTeamError("Couldn't leave the team.");
    }
  }

  async function loadParentData() {
    const [k, t, sug, s, r, cfg] = await Promise.all([
      apiGet("/kids"), apiGet("/tasks"), apiGet("/tasks/suggestions"),
      apiGet("/submissions"), apiGet("/redemptions"), apiGet("/settings"),
    ]);
    setKids(k); setTasks(t); setSuggestions(sug); setSubmissions(s); setRedemptions(r); setSettings(cfg);
  }

  function taskStatus(taskId, kidId) {
    const subs = submissions.filter(s => s.taskId === taskId && s.kidId === kidId);
    if (subs.length === 0) return null;
    return subs[subs.length - 1];
  }

  async function kidLogin(handle, pin) {
    setKidLoginError(null);
    try {
      const res = await fetch(API + "/auth/kid-login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ handle, pin }),
      });
      const data = await res.json();
      if (!res.ok) {
        setKidLoginError(
          res.status === 429 ? "Too many wrong PINs -- try again in a few minutes."
          : data.error === "unknown handle" ? "Never heard of that ID -- check the spelling?"
          : "Wrong PIN."
        );
        return;
      }
      try { localStorage.setItem("codequest:lastHandle", handle); } catch (e) {}
      setSelectedKid(data.kid);
      setAuthRole("kid");
      setLoading(true);
      await loadKidData(data.kid.id);
      const me = await apiGet("/auth/me");
      setFamilyName(me.familyName || null);
    } catch (e) {
      setKidLoginError("Couldn't reach the server.");
    } finally {
      setLoading(false);
    }
  }

  async function logout() {
    try { await fetch(API + "/auth/logout", { method: "POST" }); } catch (e) {}
    setAuthRole(null); setSelectedKid(null); setFamilyName(null);
    setKids([]); setTasks([]); setSuggestions([]); setSubmissions([]); setRedemptions([]);
    setSettings(DEFAULT_SETTINGS); setKidLoginError(null);
  }

  async function updateKid(kidId, fields) {
    try {
      const updated = await apiPut("/kids/" + kidId, fields);
      setKids(kids.map(k => k.id === kidId ? updated : k));
    } catch (e) {
      setError("Update kid failed: " + e.message);
    }
  }

  async function addKid(name) {
    try {
      const created = await apiPost("/kids", { name });
      setKids([...kids, created]);
    } catch (e) {
      setError("Add kid failed: " + e.message);
    }
  }

  async function submitTask(taskId, explanation, code, snapshot, pasted) {
    const task = tasks.find(t => t.id === taskId);
    try {
      const created = await apiPost("/submissions", {
        taskId, title: task.title, points: task.points, explanation, code, snapshot, kidId: selectedKid.id, pasted,
      });
      setSubmissions([...submissions, created]);
    } catch (e) {
      setError("Submit failed: " + e.message);
    }
  }

  async function reviewSubmission(subId, decision, note) {
    try {
      const updated = await apiPatch("/submissions/" + subId, { status: decision, reviewNote: note || "" });
      setSubmissions(submissions.map(s => s.id === subId ? updated : s));
    } catch (e) {
      setError("Review failed: " + e.message);
    }
  }

  async function redeem(minutes) {
    const points = minutes * settings.pointsPerMinute;
    try {
      const created = await apiPost("/redemptions", { minutes, points, kidId: selectedKid.id });
      setRedemptions([...redemptions, created]);
    } catch (e) {
      setError("Redeem failed: " + e.message);
    }
  }

  async function addTask(task) {
    try {
      const created = await apiPost("/tasks", task);
      setTasks([...tasks, created]);
    } catch (e) {
      setError("Add task failed: " + e.message);
    }
  }

  async function deleteTask(taskId) {
    try {
      await apiDelete("/tasks/" + taskId);
      setTasks(tasks.filter(t => t.id !== taskId));
    } catch (e) {
      setError("Delete failed: " + e.message);
    }
  }

  async function approveSuggestion(taskId) {
    try {
      const approved = await apiPost("/tasks/suggestions/" + taskId + "/approve", {});
      setSuggestions(suggestions.filter(t => t.id !== taskId));
      setTasks([...tasks, approved]);
    } catch (e) {
      setError("Approve failed: " + e.message);
    }
  }

  async function rejectSuggestion(taskId) {
    try {
      await apiDelete("/tasks/" + taskId);
      setSuggestions(suggestions.filter(t => t.id !== taskId));
    } catch (e) {
      setError("Reject failed: " + e.message);
    }
  }

  async function updateSettings(next) {
    try {
      const updated = await apiPut("/settings", next);
      setSettings(updated);
    } catch (e) {
      setError("Settings save failed: " + e.message);
    }
  }

  if (!authChecked || loading) {
    return (
      <div style={GRID_BG} className="flex items-center justify-center">
        <div className="text-teal-300 font-mono text-sm tracking-widest animate-pulse">CONNECTING…</div>
      </div>
    );
  }

  return (
    <div style={GRID_BG} className="text-slate-100">
      {error && (
        <div className="bg-red-500/20 border-b border-red-400/40 text-red-200 text-sm px-4 py-2 flex items-center gap-2 font-mono">
          <IconAlert /> {error}
          <button onClick={bootstrap} className="ml-auto underline">retry</button>
          <button onClick={() => setError(null)} className="underline">dismiss</button>
        </div>
      )}
      {!authRole && <AuthLanding onKidLogin={kidLogin} kidLoginError={kidLoginError} />}
      {authRole === "kid" && selectedKid && (
        <KidView kid={selectedKid} tasks={tasks} submissions={submissions} redemptions={redemptions} settings={settings}
          taskStatus={taskStatus} team={team} teamError={teamError}
          onSubmit={submitTask} onRedeem={redeem} onBack={logout}
          onCreateTeam={createTeam} onJoinTeam={joinTeam} onLeaveTeam={leaveTeam} />
      )}
      {authRole === "parent" && (
        <ParentView kids={kids} tasks={tasks} suggestions={suggestions} submissions={submissions} redemptions={redemptions} settings={settings}
          onReview={reviewSubmission} onAddTask={addTask} onDeleteTask={deleteTask}
          onApproveSuggestion={approveSuggestion} onRejectSuggestion={rejectSuggestion}
          onUpdateSettings={updateSettings} onUpdateKid={updateKid} onAddKid={addKid}
          familyName={familyName} onBack={logout} />
      )}
    </div>
  );
}

function Corner({ className }) {

// Replaces the old RoleSelect (tap-your-name-from-a-list) + PinGate --
// there's no more public list of a family's kids to tap through (that
// would leak family membership to anyone who loaded the page), so a
// kid types their own generated login id instead, and a parent signs
// in with Google. Both resolve family_id from the server session, not
// from anything picked in this UI.
function AuthLanding({ onKidLogin, kidLoginError }) {
  const [handle, setHandle] = useState(() => {
    try { return localStorage.getItem("codequest:lastHandle") || ""; } catch (e) { return ""; }
  });
  const [pin, setPin] = useState("");

  function submit() {
    if (!handle.trim() || !pin.trim()) return;
    onKidLogin(handle.trim(), pin.trim());
  }

  return (
    <div className="min-h-screen flex flex-col items-center justify-center px-6 gap-10">
      <div className="text-center">
        <img src="/turtle-knight.svg" alt="Code Quest" className="w-20 h-20 mx-auto mb-3" />
        <div className="flex items-center justify-center gap-2 text-amber-400 font-mono text-xs tracking-[0.3em] mb-2">
          <IconTerminal /> CODE QUEST
        </div>
        <h1 className="text-3xl font-bold text-slate-100">Mission Control</h1>
      </div>
      <div className="flex gap-6 w-full max-w-md flex-col">
        <Panel className="flex flex-col items-center gap-3 py-6">
          <IconZap size={24} className="text-teal-300" />
          <span className="font-mono text-xs tracking-widest text-slate-300">I'M A KID</span>
          <input value={handle} onChange={(e) => setHandle(e.target.value)}
            placeholder="Your Code Quest ID (e.g. PinkPanther29)" autoCapitalize="none"
            className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-center font-mono text-sm outline-none focus:border-teal-300" />
          <input type="password" inputMode="numeric" value={pin} onChange={(e) => setPin(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && submit()} placeholder="PIN"
            className="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-center tracking-[0.4em] font-mono text-lg outline-none focus:border-teal-300" />
          {kidLoginError && <div className="text-red-400 text-xs font-mono text-center">{kidLoginError}</div>}
          <button onClick={submit} className="w-full bg-teal-400 text-slate-900 font-semibold rounded py-2 text-sm transition-colors">Enter</button>
        </Panel>
        <a href="/api/auth/google/login" className="block">
          <Panel className="flex flex-col items-center gap-2 py-6 hover:border-amber-400/60 transition-colors">
            <IconLock size={24} className="text-amber-400" />
            <span className="font-mono text-sm tracking-wide text-slate-200">I'M A GROWN-UP</span>
            <span className="text-xs text-slate-400">Sign in with Google</span>
          </Panel>
        </a>
      </div>
    </div>
  );
}

  const pct = Math.min(100, (balance / 100) * 100);
  return (
    <Panel>
      <div className="flex items-end justify-between mb-3">
        <div>
          <div className="font-mono text-xs text-slate-400 tracking-widest mb-1">POINT BALANCE</div>
          <div className="text-4xl font-bold text-teal-300 font-mono">{balance}</div>
        </div>
        <div className="text-right">
          <div className="font-mono text-xs text-slate-400 tracking-widest mb-1">≈ SCREEN TIME</div>

        </div>
      </div>
      <div className="h-3 bg-slate-800 rounded-full overflow-hidden border border-slate-600/50">

function KidView({ kid, tasks, submissions, redemptions, settings, taskStatus, team, teamError,
  onSubmit, onRedeem, onBack, onCreateTeam, onJoinTeam, onLeaveTeam }) {
  const [tab, setTab] = useState("quest");
  const [redeemMinutes, setRedeemMinutes] = useState(15);

  const kidTasks = tasks.filter(t => t.kidId === kid.id);
  const kidSubmissions = submissions.filter(s => s.kidId === kid.id);
  const kidRedemptions = redemptions.filter(r => r.kidId === kid.id);

  const approvedPoints = kidSubmissions.filter(s => s.status === "approved").reduce((sum, s) => sum + s.points, 0);
  const redeemedPoints = kidRedemptions.reduce((sum, r) => sum + r.points, 0);
  const balance = approvedPoints - redeemedPoints;
  const todaysRedeemedMinutes = kidRedemptions.filter(r => r.date === todayStr()).reduce((sum, r) => sum + r.minutes, 0);

  const minutesAvailable = Math.floor(balance / settings.pointsPerMinute);
  const capRemaining = Math.max(0, settings.dailyCapMinutes - todaysRedeemedMinutes);
  const maxRedeemable = Math.min(minutesAvailable, capRemaining);

  const available = kidTasks.filter(t => {
    const s = taskStatus(t.id, kid.id);
    return !s || s.status === "rejected";
  });
  const fundamentals = available.filter(t => t.difficulty === "fundamentals");
  const pending = kidSubmissions.filter(s => s.status === "pending");
  const approved = kidSubmissions.filter(s => s.status === "approved");

  const tabCount = { quest: pending.length };

  return (
    <div className="max-w-2xl mx-auto px-4 py-6 pb-16">
      <div className="mb-4 font-mono text-sm text-slate-300 tracking-wide">{kid.name.toUpperCase()}</div>
      <div className="flex gap-1 mb-6 font-mono text-xs">
        {["quest", "learn", "history", "community", "me"].map(key => (
          <button key={key} onClick={() => setTab(key)}
            className={"px-3 py-1.5 rounded-t border-b-2 tracking-wide " + (tab === key ? "border-amber-400 text-amber-400" : "border-transparent text-slate-500 hover:text-slate-300")}>
            {key.toUpperCase()}{tabCount[key] > 0 ? " (" + tabCount[key] + ")" : ""}
          </button>
        ))}
      </div>

      {tab === "quest" && (
        <div>
          <div className="mb-4 text-xs font-mono text-slate-500 flex items-center gap-2">
            <IconTerminal size={13} /> Pick a task, write your code right here, and watch it draw.
          </div>
          <div className="mb-6"><GaugeBar balance={balance} minutesAvailable={minutesAvailable} /></div>

          {maxRedeemable > 0 && (
            <div className="mb-6">
              <Panel>
                <div className="font-mono text-xs text-slate-400 tracking-widest mb-3">REDEEM FOR SCREEN TIME</div>
                <div className="flex items-center gap-3">
                  <input type="range" min={5} max={Math.max(5, maxRedeemable)} step={5}
                    value={Math.min(redeemMinutes, maxRedeemable)}
                    onChange={(e) => setRedeemMinutes(Number(e.target.value))}
                    className="flex-1 accent-amber-400" />
                  <span className="font-mono text-amber-400 w-14 text-right">{Math.min(redeemMinutes, maxRedeemable)}m</span>
                </div>
                <div className="text-xs text-slate-500 font-mono mt-1">
                  {capRemaining < settings.dailyCapMinutes && (capRemaining + "m left of today's cap")}
                </div>
                <button onClick={() => onRedeem(Math.min(redeemMinutes, maxRedeemable))}
                  className="mt-3 w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold rounded py-2 text-sm transition-colors">
                  Redeem {Math.min(redeemMinutes, maxRedeemable)} minutes
                </button>
              </Panel>
            </div>
          )}

          {pending.length > 0 && (
            <Section label="WAITING FOR REVIEW">
              {pending.map(s => (
                <div key={s.id} className="flex items-center justify-between py-2 border-b border-slate-700/50 last:border-0">
                  <span className="text-slate-300 text-sm">{s.title}</span>
                  <span className="font-mono text-xs text-amber-400 flex items-center gap-1"><IconClock size={12} /> pending</span>
                </div>
              ))}
            </Section>
          )}

          <Section label="MYSTERY QUESTS">
            <MysteryBoxPicker kidId={kid.id} available={available} kidTasks={kidTasks} kidSubmissions={kidSubmissions} onSubmit={onSubmit} />
          </Section>
        </div>
      )}

      {tab === "learn" && (
        fundamentals.length > 0 ? (
          <Section label="FUNDAMENTALS PRACTICE">
            <FundamentalsPractice kidId={kid.id} tasks={fundamentals} onSubmit={onSubmit} />
          </Section>
        ) : (
          <div className="text-sm text-slate-500 font-mono py-6 text-center">Nothing left to practice right now -- nice work.</div>
        )
      )}

      {tab === "history" && (
        <HistoryPanel kidId={kid.id} kidTasks={kidTasks} approved={approved} onSubmit={onSubmit} />
      )}

      {tab === "community" && (
        <CommunityPanel team={team} teamError={teamError}
          onCreateTeam={onCreateTeam} onJoinTeam={onJoinTeam} onLeaveTeam={onLeaveTeam} />
      )}

      {tab === "me" && (
        <MePanel submissions={kidSubmissions} onLogout={onBack} />

  );
