const { useState, useEffect, useRef } = React;

// ---------- storage: talks to the Flask+SQLite backend over the API ----------
const API = "/api";

async function apiGet(path) {
  const res = await fetch(API + path);
  if (!res.ok) throw new Error("GET " + path + " failed (" + res.status + ")");
  return res.json();
}
function pinHeaders(pin) {
  return pin ? { "X-Parent-Pin": pin } : {};
}
async function apiPost(path, body, pin) {
  const res = await fetch(API + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", ...pinHeaders(pin) },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("POST " + path + " failed (" + res.status + ")");
  return res.json();
}
async function apiPatch(path, body, pin) {
  const res = await fetch(API + path, {
    method: "PATCH",
    headers: { "Content-Type": "application/json", ...pinHeaders(pin) },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("PATCH " + path + " failed (" + res.status + ")");
  return res.json();
}
async function apiPut(path, body, pin) {
  const res = await fetch(API + path, {
    method: "PUT",
    headers: { "Content-Type": "application/json", ...pinHeaders(pin) },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error("PUT " + path + " failed (" + res.status + ")");
  return res.json();
}
async function apiDelete(path, pin) {
  const res = await fetch(API + path, { method: "DELETE", headers: pinHeaders(pin) });
  if (!res.ok) throw new Error("DELETE " + path + " failed (" + res.status + ")");
  return res.json();
}

// ---------- in-browser Python execution (Skulpt) ----------
function skulptBuiltinRead(x) {
  if (Sk.builtinFiles === undefined || Sk.builtinFiles["files"][x] === undefined) {
    throw "File not found: '" + x + "'";
  }
  return Sk.builtinFiles["files"][x];
}

// Runs `code` with turtle output drawn into the element with id `targetId`.
// Clears any previous drawing first (Skulpt stacks a new canvas into the
// target on every run otherwise) and focuses the target afterward so
// keyboard-driven turtle programs (onkey) work without an extra click —
// same as a real turtle/tkinter window needing focus.
function runPython(code, targetId, onOutput) {
  const target = document.getElementById(targetId);
  target.innerHTML = "";
  Sk.configure({
    output: onOutput,
    read: skulptBuiltinRead,
    __future__: Sk.python3,
    // Turtle animates movement over real time by default (that's the
    // charm of it) — a correct program with a lot of drawing (nested
    // loops, many shapes) can legitimately take a while to finish
    // animating, so this needs real headroom, not just enough to catch
    // a true infinite loop.
    execLimit: 30000,
    yieldLimit: 200,
  });
  (Sk.TurtleGraphics || (Sk.TurtleGraphics = {})).target = targetId;
  return Sk.misceval.asyncToPromise(function () {
    return Sk.importMainWithBody("<stdin>", false, code, true);
  }).then(
    function () {
      target.focus();
      return { ok: true };
    },
    function (err) {
      target.focus();
      return { ok: false, error: err.toString() };
    }
  );
}

// Downscales an uploaded photo to a small square-ish thumbnail before it
// ever becomes a data URL — kid avatars are shown at a few dozen px on
// the landing screen, and GET /api/kids loads before anyone's picked a
// kid, so an un-resized multi-MB phone photo would bloat that first
// fetch for no visual benefit.
function readImageAsResizedDataUrl(file, maxSize = 200) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", 0.85));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const DEFAULT_SETTINGS = { pointsPerMinute: 1, dailyCapMinutes: 60 };

const GRID_BG = {
  backgroundColor: "#0F2942",
  backgroundImage: "linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px)",
  backgroundSize: "28px 28px",
  minHeight: "100vh",
};

const DIFFICULTY = {
  easy: { label: "EASY", color: "#5EEAD4" },
  medium: { label: "MEDIUM", color: "#F5A623" },
  hard: { label: "HARD", color: "#F87171" },
};

);
const IconTerminal = (p) => <Icon {...p}>⌘</Icon>;
const IconZap = (p) => <Icon {...p}>⚡</Icon>;
const IconLock = (p) => <Icon {...p}>🔒</Icon>;

const IconClock = (p) => <Icon {...p}>⏱</Icon>;
const IconCheck = (p) => <Icon {...p}>✓</Icon>;

const IconPlus = (p) => <Icon {...p}>+</Icon>;
const IconTrash = (p) => <Icon {...p}>🗑</Icon>;

const IconSend = (p) => <Icon {...p}>➤</Icon>;
const IconRedo = (p) => <Icon {...p}>↺</Icon>;
const IconAward = (p) => <Icon {...p}>🏆</Icon>;

// ---------- mystery-box (盲盒) task picker ----------
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function skillExposureCounts(kidTasks, kidSubmissions) {
  const submittedIds = new Set(kidSubmissions.map(s => s.taskId));
  const counts = {};
  kidTasks.filter(t => submittedIds.has(t.id)).forEach(t => {
    (t.skills || []).forEach(sk => { counts[sk] = (counts[sk] || 0) + 1; });
  });
  return counts;
}

const DIFFICULTY_ORDER = ["easy", "medium", "hard"];

// A kid's "current level" is the hardest difficulty they have an
// approved submission for — their proven ceiling, not just whatever
// they most recently attempted (a rejected hard attempt shouldn't count).
function currentDifficultyLevel(kidTasks, kidSubmissions) {
  const approvedIds = new Set(kidSubmissions.filter(s => s.status === "approved").map(s => s.taskId));
  const cleared = kidTasks.filter(t => approvedIds.has(t.id)).map(t => t.difficulty);
  if (cleared.length === 0) return "easy";
  return cleared.reduce((max, d) => DIFFICULTY_ORDER.indexOf(d) > DIFFICULTY_ORDER.indexOf(max) ? d : max, "easy");
}

function scoreTasks(tasks, counts) {
  return tasks.map(t => ({
    task: t,
    score: t.skills && t.skills.length ? Math.min(...t.skills.map(sk => counts[sk] || 0)) : 0.5,
  })).sort((a, b) => a.score - b.score);
}

// Skill-gap shortlist-then-shuffle, same idea curate_tasks.py uses to
// generate new tasks, applied here to rank ones that already exist.
function pickFromPool(pool, counts, excludeIds) {
  const candidates = pool.filter(t => !excludeIds.includes(t.id));
  const shortlist = scoreTasks(candidates, counts).slice(0, 6).map(s => s.task);
  return shuffle(shortlist)[0] || null;
}

// tier "current" pulls from the kid's proven-ceiling difficulty; tier
// "stretch" pulls from one difficulty above that. Falls back to any
// remaining available task (still skill-gap scored) if the target
// bucket is empty, so a box still fills whenever any task is left.
function pickOneForTier(tier, available, counts, level, excludeIds) {
  const nextLevel = DIFFICULTY_ORDER[Math.min(DIFFICULTY_ORDER.indexOf(level) + 1, DIFFICULTY_ORDER.length - 1)];
  const target = tier === "stretch" ? nextLevel : level;
  const bucket = available.filter(t => t.difficulty === target);
  return pickFromPool(bucket, counts, excludeIds) || pickFromPool(available, counts, excludeIds);
}

// Picks up to 3 tasks: 2 at the kid's current level, 1 stretch task one
// difficulty higher, favoring skills least represented in their
// submission history so far within each bucket.
function pickMysteryTasks(available, kidTasks, kidSubmissions, excludeIds = []) {
  const counts = skillExposureCounts(kidTasks, kidSubmissions);
  const level = currentDifficultyLevel(kidTasks, kidSubmissions);
  const used = excludeIds.slice();
  const boxes = [];
  for (const tier of ["current", "current", "stretch"]) {
    const task = pickOneForTier(tier, available, counts, level, used);
    if (!task) continue;
    boxes.push({ task, tier });
    used.push(task.id);
  }
  return boxes;
}

// In-progress code/explanation, so an accidental tab close doesn't lose
// work. Scoped per kid+task; cleared on a deliberate forfeit or submit,
// left alone otherwise (that's the whole point).
function draftKey(kidId, taskId) { return "codequest:draft:" + kidId + ":" + taskId; }
function loadDraft(kidId, taskId) {
  try { return JSON.parse(localStorage.getItem(draftKey(kidId, taskId))) || {}; } catch (e) { return {}; }
}
function saveDraft(kidId, taskId, draft) {
  try { localStorage.setItem(draftKey(kidId, taskId), JSON.stringify(draft)); } catch (e) {}
}
function clearDraft(kidId, taskId) {
  try { localStorage.removeItem(draftKey(kidId, taskId)); } catch (e) {}
}

const BOX_VARIANTS = [
  { lid: "#F5A623", body: "#B45309" },
  { lid: "#5EEAD4", body: "#0D9488" },
  { lid: "#F87171", body: "#B91C1C" },
  { lid: "#A78BFA", body: "#6D28D9" },
  { lid: "#60A5FA", body: "#1D4ED8" },
  { lid: "#FDE047", body: "#CA8A04" },
];

function MysteryBox({ variant, size = 88 }) {
  return (
    <svg width={size} height={size} viewBox="0 0 100 100">
      <rect x="18" y="42" width="64" height="42" rx="4" fill={variant.body} />
      <rect x="14" y="30" width="72" height="16" rx="3" fill={variant.lid} />
      <rect x="44" y="30" width="12" height="54" fill={variant.body} opacity="0.85" />
      <rect x="14" y="36" width="72" height="6" fill={variant.body} opacity="0.85" />
      <text x="50" y="68" textAnchor="middle" fontSize="26" fontWeight="bold" fill="white" opacity="0.9">?</text>
    </svg>
  );
}

function MysteryBoxPicker({ kidId, available, kidTasks, kidSubmissions, onSubmit }) {
  const [boxes, setBoxes] = useState(() => pickMysteryTasks(available, kidTasks, kidSubmissions));
  const [variants, setVariants] = useState(() => shuffle(BOX_VARIANTS).slice(0, boxes.length));
  const [openedIndex, setOpenedIndex] = useState(null);
  const [activeTask, setActiveTask] = useState(null);
  const [explanation, setExplanation] = useState("");
  const [code, setCode] = useState("");

  function rerollSlot(index) {
    const shownIds = boxes.map(b => b.task.id);
    const counts = skillExposureCounts(kidTasks, kidSubmissions);
    const level = currentDifficultyLevel(kidTasks, kidSubmissions);
    const replacement = pickOneForTier(boxes[index].tier, available, counts, level, shownIds);
    setBoxes(boxes.map((b, i) => (i === index ? { task: replacement || b.task, tier: b.tier } : b)));
    setVariants(prev => {
      const usedElsewhere = prev.filter((_, i) => i !== index);
      const fresh = shuffle(BOX_VARIANTS.filter(v => !usedElsewhere.includes(v)))[0] || shuffle(BOX_VARIANTS)[0];
      return prev.map((v, i) => (i === index ? fresh : v));
    });
    setOpenedIndex(null);
  }

  function startTask(task) {
    const draft = loadDraft(kidId, task.id);
    setExplanation(draft.explanation || "");
    setCode(draft.code || "");
    setActiveTask(task);
  }

  useEffect(() => {
    if (!activeTask) return;
    saveDraft(kidId, activeTask.id, { code, explanation });
  }, [code, explanation, activeTask, kidId]);

  if (boxes.length === 0 || !boxes.some(b => b.task)) {
    return <div className="text-slate-500 text-sm italic">All caught up — ask Dad for new tasks.</div>;
  }

  return (
    <div>
      <div className="grid grid-cols-3 gap-3">
        {boxes.map((b, i) => b.task && (
          <button key={b.task.id} onClick={() => setOpenedIndex(i)} disabled={openedIndex === i}
            className={"flex flex-col items-center gap-2 " + (openedIndex === i ? "opacity-40" : "hover:scale-105 transition-transform")}>
            <MysteryBox variant={variants[i] || BOX_VARIANTS[0]} />
            <span className="font-mono text-xs text-slate-500">MYSTERY QUEST</span>
          </button>
        ))}
      </div>

      {openedIndex !== null && boxes[openedIndex] && boxes[openedIndex].task && (
        <div className="mt-4">
          <Panel>
            {(() => {
              const task = boxes[openedIndex].task;
              const d = DIFFICULTY[task.difficulty];
              return (
                <>
                  <div className="flex items-start justify-between gap-3 mb-3">
                    <div>
                      <div className="font-semibold text-slate-100 mb-1">{task.title}</div>
                      <div className="text-sm text-slate-400 leading-snug">{task.brief}</div>
                    </div>
                    <div className="flex flex-col items-end gap-1 shrink-0">
                      <span className="font-mono text-xs px-1.5 py-0.5 rounded" style={{ color: d.color, border: "1px solid " + d.color + "55" }}>{d.label}</span>
                      <span className="font-mono text-teal-300 text-sm flex items-center gap-1"><IconStar size={12} />{task.points}</span>
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => startTask(task)}
                      className="flex-1 bg-teal-500 hover:bg-teal-400 text-slate-900 font-semibold rounded py-2 text-sm transition-colors">
                      Start This Quest
                    </button>
                    <button onClick={() => rerollSlot(openedIndex)}
                      className="px-3 py-2 rounded text-sm font-mono text-slate-400 hover:text-slate-200 border border-slate-600 flex items-center gap-1">
                      <IconRedo size={13} /> Put It Back
                    </button>
                  </div>
                </>
              );
            })()}
          </Panel>
        </div>
      )}

      {activeTask && (
        <SubmitModal task={activeTask} explanation={explanation} setExplanation={setExplanation}
          code={code} setCode={setCode}
          onCancel={() => { clearDraft(kidId, activeTask.id); rerollSlot(openedIndex); setActiveTask(null); setExplanation(""); setCode(""); }}
          onSubmit={(snapshot) => { clearDraft(kidId, activeTask.id); onSubmit(activeTask.id, explanation, code, snapshot); setActiveTask(null); setExplanation(""); setCode(""); setOpenedIndex(null); }} />
      )}
    </div>
  );
}

function App() {
  const [role, setRole] = useState(null);
  const [loading, setLoading] = useState(true);
  const [kids, setKids] = useState([]);
  const [selectedKid, setSelectedKid] = useState(null);
  const [pendingKid, setPendingKid] = useState(null);
  const [tasks, setTasks] = useState([]);
  const [suggestions, setSuggestions] = useState([]);
  const [submissions, setSubmissions] = useState([]);
  const [redemptions, setRedemptions] = useState([]);
  const [settings, setSettings] = useState(DEFAULT_SETTINGS);
  const [pinInput, setPinInput] = useState("");
  const [pinError, setPinError] = useState(false);
  const [parentPin, setParentPin] = useState(null);
  const [error, setError] = useState(null);

  useEffect(() => { loadAll(); }, []);

  async function loadAll() {
    setLoading(true);
    setError(null);
    try {
      const [k, t, sug, s, r, cfg] = await Promise.all([
        apiGet("/kids"), apiGet("/tasks"), apiGet("/tasks/suggestions"),
        apiGet("/submissions"), apiGet("/redemptions"), apiGet("/settings"),
      ]);
      setKids(k); setTasks(t); setSuggestions(sug); setSubmissions(s); setRedemptions(r); setSettings(cfg);
    } catch (e) {
      setError("Couldn't reach the server. Is app.py running? (" + e.message + ")");
    } finally {
      setLoading(false);
    }
  }

  function taskStatus(taskId, kidId) {
    const subs = submissions.filter(s => s.taskId === taskId && s.kidId === kidId);
    if (subs.length === 0) return null;
    return subs[subs.length - 1];
  }

  function selectKid(kid) {
    setPendingKid(kid);
    setRole("kid-gate");
    setPinInput("");
    setPinError(false);
  }

  async function tryKidPin(pin) {
    try {
      const res = await fetch(API + "/auth/verify-kid-pin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ kidId: pendingKid.id, pin }),
      });
      if (res.ok) {
        setSelectedKid(pendingKid); setPendingKid(null); setRole("kid"); setPinInput(""); setPinError(false);
      } else {
        setPinError(true);
      }
    } catch (e) {
      setPinError(true);
    }
  }

  async function updateKid(kidId, fields) {
    try {
      const updated = await apiPut("/kids/" + kidId, fields, parentPin);
      setKids(kids.map(k => k.id === kidId ? updated : k));
    } catch (e) {
      setError("Update kid failed: " + e.message);
    }
  }

  async function submitTask(taskId, explanation, code, snapshot) {
    const task = tasks.find(t => t.id === taskId);
    try {
      const created = await apiPost("/submissions", {
        taskId, title: task.title, points: task.points, explanation, code, snapshot, kidId: selectedKid.id,
      });
      setSubmissions([...submissions, created]);
    } catch (e) {
      setError("Submit failed: " + e.message);
    }
  }

  async function reviewSubmission(subId, decision, note) {
    try {
      const updated = await apiPatch("/submissions/" + subId, { status: decision, reviewNote: note || "" }, parentPin);
      setSubmissions(submissions.map(s => s.id === subId ? updated : s));
    } catch (e) {
      setError("Review failed: " + e.message);
    }
  }

  async function redeem(minutes) {
    const points = minutes * settings.pointsPerMinute;
    try {
      const created = await apiPost("/redemptions", { minutes, points, kidId: selectedKid.id });
      setRedemptions([...redemptions, created]);
    } catch (e) {
      setError("Redeem failed: " + e.message);
    }
  }

  async function addTask(task) {
    try {
      const created = await apiPost("/tasks", task, parentPin);
      setTasks([...tasks, created]);
    } catch (e) {
      setError("Add task failed: " + e.message);
    }
  }

  async function deleteTask(taskId) {
    try {
      await apiDelete("/tasks/" + taskId, parentPin);
      setTasks(tasks.filter(t => t.id !== taskId));
    } catch (e) {
      setError("Delete failed: " + e.message);
    }
  }

  async function approveSuggestion(taskId) {
    try {
      const approved = await apiPost("/tasks/suggestions/" + taskId + "/approve", {}, parentPin);
      setSuggestions(suggestions.filter(t => t.id !== taskId));
      setTasks([...tasks, approved]);
    } catch (e) {
      setError("Approve failed: " + e.message);
    }
  }

  async function rejectSuggestion(taskId) {
    try {
      await apiDelete("/tasks/" + taskId, parentPin);
      setSuggestions(suggestions.filter(t => t.id !== taskId));
    } catch (e) {
      setError("Reject failed: " + e.message);
    }
  }

  async function updateSettings(next) {
    try {
      const updated = await apiPut("/settings", next, parentPin);
      setSettings(updated);
      if (next.parentPin) setParentPin(next.parentPin);
    } catch (e) {
      setError("Settings save failed: " + e.message);
    }
  }

  async function tryParentPin(pin) {
    try {
      const res = await fetch(API + "/auth/verify-pin", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ pin }),
      });
      if (res.ok) {
        setParentPin(pin); setRole("parent"); setPinInput(""); setPinError(false);
      } else {
        setPinError(true);
      }
    } catch (e) {
      setPinError(true);
    }
  }

  if (loading) {
    return (
      <div style={GRID_BG} className="flex items-center justify-center">
        <div className="text-teal-300 font-mono text-sm tracking-widest animate-pulse">CONNECTING…</div>
      </div>
    );
  }

  return (
    <div style={GRID_BG} className="text-slate-100">
      {error && (
        <div className="bg-red-500/20 border-b border-red-400/40 text-red-200 text-sm px-4 py-2 flex items-center gap-2 font-mono">
          <IconAlert /> {error}
          <button onClick={loadAll} className="ml-auto underline">retry</button>
          <button onClick={() => setError(null)} className="underline">dismiss</button>
        </div>
      )}
      {!role && <RoleSelect kids={kids} onSelectKid={selectKid} onParentAttempt={() => setRole("parent-gate")} />}
      {role === "parent-gate" && (
        <PinGate pinInput={pinInput} setPinInput={setPinInput} pinError={pinError}
          onSubmit={() => tryParentPin(pinInput)}
          onBack={() => { setRole(null); setPinInput(""); setPinError(false); }} />
      )}
      {role === "kid-gate" && pendingKid && (
        <PinGate pinInput={pinInput} setPinInput={setPinInput} pinError={pinError}
          label={pendingKid.name.toUpperCase() + " ACCESS"}
          onSubmit={() => tryKidPin(pinInput)}
          onBack={() => { setRole(null); setPendingKid(null); setPinInput(""); setPinError(false); }} />
      )}
      {role === "kid" && selectedKid && (
        <KidView kid={selectedKid} tasks={tasks} submissions={submissions} redemptions={redemptions} settings={settings}
          taskStatus={taskStatus}
          onSubmit={submitTask} onRedeem={redeem} onBack={() => { setRole(null); setSelectedKid(null); }} />
      )}
      {role === "parent" && (
        <ParentView kids={kids} tasks={tasks} suggestions={suggestions} submissions={submissions} redemptions={redemptions} settings={settings}
          onReview={reviewSubmission} onAddTask={addTask} onDeleteTask={deleteTask}
          onApproveSuggestion={approveSuggestion} onRejectSuggestion={rejectSuggestion}
          onUpdateSettings={updateSettings} onUpdateKid={updateKid} onBack={() => { setRole(null); setParentPin(null); }} />
      )}
    </div>
  );
}

function Corner({ className }) {
  return <div className={"absolute w-3 h-3 border-amber-400/70 " + className} />;
}

function KidView({ kid, tasks, submissions, redemptions, settings, taskStatus, onSubmit, onRedeem, onBack }) {
  const [redeemMinutes, setRedeemMinutes] = useState(15);

  const kidTasks = tasks.filter(t => t.kidId === kid.id);
  const kidSubmissions = submissions.filter(s => s.kidId === kid.id);
  const kidRedemptions = redemptions.filter(r => r.kidId === kid.id);

  const approvedPoints = kidSubmissions.filter(s => s.status === "approved").reduce((sum, s) => sum + s.points, 0);
  const redeemedPoints = kidRedemptions.reduce((sum, r) => sum + r.points, 0);
  const balance = approvedPoints - redeemedPoints;
  const todaysRedeemedMinutes = kidRedemptions.filter(r => r.date === todayStr()).reduce((sum, r) => sum + r.minutes, 0);

  const minutesAvailable = Math.floor(balance / settings.pointsPerMinute);
  const capRemaining = Math.max(0, settings.dailyCapMinutes - todaysRedeemedMinutes);
  const maxRedeemable = Math.min(minutesAvailable, capRemaining);

  const available = kidTasks.filter(t => {
    const s = taskStatus(t.id, kid.id);
    return !s || s.status === "rejected";
  });
  const pending = kidSubmissions.filter(s => s.status === "pending");
  const approved = kidSubmissions.filter(s => s.status === "approved");

  return (
    <div className="max-w-2xl mx-auto px-4 py-6 pb-16">
      <TopBar onBack={onBack} label={kid.name.toUpperCase()} />
      <div className="mb-4 text-xs font-mono text-slate-500 flex items-center gap-2">
        <IconTerminal size={13} /> Pick a task, write your code right here, and watch it draw.
      </div>
      <div className="mb-6"><GaugeBar balance={balance} minutesAvailable={minutesAvailable} /></div>

      {maxRedeemable > 0 && (
        <div className="mb-6">
          <Panel>
            <div className="font-mono text-xs text-slate-400 tracking-widest mb-3">REDEEM FOR SCREEN TIME</div>
            <div className="flex items-center gap-3">
              <input type="range" min={5} max={Math.max(5, maxRedeemable)} step={5}
                value={Math.min(redeemMinutes, maxRedeemable)}
                onChange={(e) => setRedeemMinutes(Number(e.target.value))}
                className="flex-1 accent-amber-400" />
              <span className="font-mono text-amber-400 w-14 text-right">{Math.min(redeemMinutes, maxRedeemable)}m</span>
            </div>
            <div className="text-xs text-slate-500 font-mono mt-1">
              {capRemaining < settings.dailyCapMinutes && (capRemaining + "m left of today's cap")}
            </div>
            <button onClick={() => onRedeem(Math.min(redeemMinutes, maxRedeemable))}
              className="mt-3 w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold rounded py-2 text-sm transition-colors">
              Redeem {Math.min(redeemMinutes, maxRedeemable)} minutes
            </button>
          </Panel>
        </div>
      )}

      {pending.length > 0 && (
        <Section label="WAITING FOR REVIEW">
          {pending.map(s => (
            <div key={s.id} className="flex items-center justify-between py-2 border-b border-slate-700/50 last:border-0">
              <span className="text-slate-300 text-sm">{s.title}</span>
              <span className="font-mono text-xs text-amber-400 flex items-center gap-1"><IconClock size={12} /> pending</span>
            </div>
          ))}
        </Section>
      )}

      <Section label="MYSTERY QUESTS">
        <MysteryBoxPicker kidId={kid.id} available={available} kidTasks={kidTasks} kidSubmissions={kidSubmissions} onSubmit={onSubmit} />
      </Section>

      {approved.length > 0 && (
        <Section label={"COMPLETED (" + approved.length + ")"}>
          <div className="grid grid-cols-3 gap-2">
            {approved.map(s => (
              <div key={s.id} className="flex flex-col items-center gap-1">
                {s.snapshot ? (
                  <img src={s.snapshot} alt={s.title} className="w-full aspect-square object-contain bg-white rounded border border-slate-700/50" />
                ) : (
                  <div className="w-full aspect-square flex items-center justify-center bg-slate-900/40 rounded border border-slate-700/50">
                    <IconCheck size={20} className="text-teal-300" />
                  </div>
                )}
                <span className="text-xs text-slate-400 text-center leading-tight">{s.title}</span>
                <span className="font-mono text-xs text-teal-300">+{s.points}</span>
              </div>
            ))}
          </div>
        </Section>
      )}
    </div>
  );
}

function SubmitModal({ task, explanation, setExplanation, code, setCode, onCancel, onSubmit }) {
  const [hasRun, setHasRun] = useState(false);
  const [running, setRunning] = useState(false);
  const [output, setOutput] = useState("");
  const [runError, setRunError] = useState(null);
  const [stopped, setStopped] = useState(false);
  const [entered, setEntered] = useState(false);
  const codeRef = useRef(null);
  // A ref, not state: handleRun's in-flight async closure needs the live
  // value at the moment runPython's promise settles, not the value from
  // when Run was clicked — state would be stale inside that closure.
  const stoppedRef = useRef(false);
  const canSubmit = explanation.trim().length >= 10 && hasRun;

  // Slide in from the right on mount rather than popping up as a dialog —
  // this is a detail page, not a modal, so it gets the same full-screen
  // treatment as the rest of the app (opaque GRID_BG, no dimmed backdrop).
  useEffect(() => {
    const id = requestAnimationFrame(() => setEntered(true));
    return () => cancelAnimationFrame(id);
  }, []);

  async function handleRun() {
    setRunning(true);
    setRunError(null);
    setStopped(false);
    stoppedRef.current = false;
    let out = "";
    setOutput("");
    try {
      const result = await runPython(code, "turtle-target", (text) => { out += text; setOutput(out); });
      if (!result.ok && !stoppedRef.current) setRunError(result.error);
    } catch (e) {
      if (!stoppedRef.current) setRunError(e.message || String(e));
    } finally {
      setHasRun(true);
      setRunning(false);
    }
  }

  // Skulpt periodically checks elapsed time against Sk.execLimit and
  // throws its own TimeLimitError when exceeded (verified directly
  // against the library) — forcing it to 0 mid-run trips that check at
  // the next yield point instead of waiting out the normal 30s ceiling.
  // Safe to mutate globally: only one run is ever in flight in this UI,
  // and runPython's Sk.configure(...) resets execLimit on every call.
  function handleStop() {
    setStopped(true);
    stoppedRef.current = true;
    Sk.execLimit = 0;
  }

  function handleCodeKeyDown(e) {
    if (e.key !== "Tab") return;
    e.preventDefault();
    const ta = codeRef.current;
    const start = ta.selectionStart, end = ta.selectionEnd;
    if (e.shiftKey) {
      const lineStart = code.lastIndexOf("\n", start - 1) + 1;
      const removable = Math.min(4, code.slice(lineStart, start).match(/^ */)[0].length);
      setCode(code.slice(0, lineStart) + code.slice(lineStart + removable));
      requestAnimationFrame(() => { ta.selectionStart = ta.selectionEnd = start - removable; });
    } else {
      setCode(code.slice(0, start) + "    " + code.slice(end));
      requestAnimationFrame(() => { ta.selectionStart = ta.selectionEnd = start + 4; });
    }
  }

  function handleSubmit() {
    const canvas = document.querySelector("#turtle-target canvas");
    onSubmit(canvas ? canvas.toDataURL("image/png") : null);
  }

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto">
      <div style={GRID_BG}
        className={"transition-transform duration-300 ease-out " + (entered ? "translate-x-0" : "translate-x-full")}>
        <div className="max-w-3xl mx-auto px-4 py-6 pb-16 text-slate-100">
          <TopBar onBack={onCancel} backLabel="Back" label={task.title.toUpperCase()} />

          <Panel className="mb-4">
            <div className="font-semibold text-slate-100 mb-1">{task.title}</div>
            <div className="text-xs text-slate-500 font-mono mb-3">Worth {task.points} points</div>
            <div className="text-sm text-slate-400">{task.brief}</div>
          </Panel>

          <div className="grid sm:grid-cols-2 gap-4 mb-4">
            <div>
              <label className="text-sm text-slate-300 mb-2 block">Your code</label>
              {/* No pasting in — the point is writing it yourself. Blocks
                  Ctrl+V, right-click paste, and middle-click paste alike,
                  since they all fire the same paste event. Not real
                  security (devtools bypass it trivially), just removes the
                  one-click path. */}
              <textarea ref={codeRef} value={code} onChange={(e) => setCode(e.target.value)} onKeyDown={handleCodeKeyDown}
                onPaste={(e) => e.preventDefault()}
                spellCheck={false} autoCapitalize="off" autoCorrect="off"
                rows={12} autoFocus
                placeholder="import turtle&#10;t = turtle.Turtle()&#10;..."
                className="w-full bg-slate-800 border border-slate-600 rounded p-3 text-xs font-mono text-teal-200 outline-none focus:border-teal-300 resize-none" />
              {running ? (
                <button onClick={handleStop}
                  className="mt-2 w-full bg-red-500 hover:bg-red-400 text-white font-semibold rounded py-2 text-sm flex items-center justify-center gap-1">
                  ■ Stop
                </button>
              ) : (
                <button onClick={handleRun}
                  className="mt-2 w-full bg-teal-400 text-slate-900 font-semibold rounded py-2 text-sm flex items-center justify-center gap-1">
                  <IconZap size={14} /> Run
                </button>
              )}
              <label className="text-sm text-slate-300 mt-3 mb-2 block">Output</label>
              <pre className={"text-xs font-mono rounded p-2 max-h-40 overflow-y-auto whitespace-pre-wrap border " +
                (stopped ? "text-amber-300 bg-amber-500/10 border-amber-400/40"
                 : runError ? "text-red-300 bg-red-500/10 border-red-400/40"
                 : "text-slate-300 bg-slate-950/60 border-slate-700")}>
                {stopped ? "Stopped." : runError ? ("Your code hit a snag: " + runError) : (output || "Nothing printed yet — click Run.")}
              </pre>
            </div>
            <div>
              <label className="text-sm text-slate-300 mb-2 block">Your drawing</label>
              <div id="turtle-target" tabIndex={0}
                className="w-full bg-white rounded border border-slate-600 outline-none"
                style={{ minHeight: 220 }} />
            </div>
          </div>

          <Panel>
            <label className="text-sm text-slate-300 mb-2 block">In your own words — what does your code do?</label>
            <textarea value={explanation} onChange={(e) => setExplanation(e.target.value)} rows={3}
              placeholder="Explain it like Dad hasn't seen it..."
              className="w-full bg-slate-800 border border-slate-600 rounded p-3 text-sm text-slate-100 outline-none focus:border-teal-300 resize-none mb-4" />

            <button disabled={!canSubmit} onClick={handleSubmit}
              className="w-full bg-teal-400 disabled:bg-slate-700 disabled:text-slate-500 text-slate-900 font-semibold rounded py-2 text-sm flex items-center justify-center gap-1">
              <IconSend size={14} /> Submit
            </button>
            {!hasRun && (
              <div className="text-xs text-slate-500 font-mono mt-2 text-center">Run your code at least once before submitting.</div>
            )}
          </Panel>
        </div>
      </div>
    </div>
  );
}

function ParentView({ kids, tasks, suggestions, submissions, redemptions, settings, onReview, onAddTask, onDeleteTask, onApproveSuggestion, onRejectSuggestion, onUpdateSettings, onUpdateKid, onBack }) {

function ReviewTab({ pending, kids, onReview }) {

// Shared by ReviewCard (pending work) and HistoryTab (already-decided
// work) — the snapshot/code/Run/output block is identical either way,
// only what surrounds it (approve/reject vs. nothing) differs.
function RunnableSubmission({ s, targetPrefix }) {
  const [running, setRunning] = useState(false);
  const [hasRun, setHasRun] = useState(false);
  const [output, setOutput] = useState("");
  const [runError, setRunError] = useState(null);
  const targetId = targetPrefix + s.id;

  async function handleRun() {
    setRunning(true);
    setRunError(null);
    setHasRun(true);
    let out = "";
    setOutput("");
    try {
      const result = await runPython(s.code || "", targetId, (text) => { out += text; setOutput(out); });
      if (!result.ok) setRunError(result.error);
    } catch (e) {
      setRunError(e.message || String(e));
    } finally {
      setRunning(false);
    }
  }

  return (
    <>
      {s.snapshot && (
        <img src={s.snapshot} alt={s.title} className="w-full max-w-xs mx-auto bg-white rounded border border-slate-700 mb-3" />
      )}
      {s.code && s.code.trim() && (
        <>
          <pre className="text-xs font-mono text-teal-200 bg-slate-950/60 border border-slate-700 rounded p-3 mb-2 overflow-x-auto whitespace-pre-wrap">{s.code}</pre>
          <button onClick={handleRun} disabled={running}
            className="w-full mb-3 border border-teal-400/40 text-teal-300 disabled:border-slate-700 disabled:text-slate-500 rounded py-1.5 text-sm flex items-center justify-center gap-1 hover:bg-teal-400/10">
            <IconZap size={13} /> {running ? "Running…" : "Run this code"}
          </button>
          {/* Always in the DOM (not gated on hasRun) — runPython needs to find
              this element synchronously when Run is clicked, before React
              has had a chance to flush the hasRun state update. Hidden via
              CSS instead of unmounting. */}
          <div className={hasRun ? "mb-3" : "hidden"}>
            <div id={targetId} tabIndex={0}
              className="w-full bg-white rounded border border-slate-600 outline-none mb-2"
              style={{ minHeight: 180 }} />
            {output && (
              <pre className="text-xs font-mono text-slate-300 bg-slate-950/60 border border-slate-700 rounded p-2 max-h-24 overflow-y-auto whitespace-pre-wrap">{output}</pre>
            )}
            {runError && (
              <div className="text-xs font-mono text-red-300 bg-red-500/10 border border-red-400/40 rounded p-2">{runError}</div>
            )}
          </div>
        </>
      )}
    </>
  );
}

            <div className="flex gap-2">
              <button onClick={() => onReject(t.id)}
                className="flex-1 border border-red-400/40 text-red-300 rounded py-1.5 text-sm flex items-center justify-center gap-1 hover:bg-red-400/10">
                <IconX size={13} /> Reject
              </button>
              <button onClick={() => onApprove(t.id)}
                className="flex-1 bg-teal-400 text-slate-900 font-semibold rounded py-1.5 text-sm flex items-center justify-center gap-1">
                <IconCheck size={13} /> Approve
              </button>
            </div>
          </Panel>
        );
      })}
    </div>
  );
}

function TasksTab({ tasks, kids, onAddTask, onDeleteTask }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ title: "", brief: "", points: 20, difficulty: "medium", kidId: kids[0]?.id || "" });
  function submit() {
    if (!form.title.trim() || !form.brief.trim() || !form.kidId) return;
    onAddTask({ ...form, points: Number(form.points) });
    setForm({ title: "", brief: "", points: 20, difficulty: "medium", kidId: kids[0]?.id || "" });
    setShowForm(false);
  }
  return (
    <div>
      <button onClick={() => setShowForm(!showForm)}
        className="mb-4 flex items-center gap-1 text-amber-400 font-mono text-xs border border-amber-400/40 rounded px-3 py-1.5 hover:bg-amber-400/10">
        <IconPlus size={14} /> New task
      </button>
      {showForm && (
        <Panel className="mb-4">
          <div className="grid gap-2">
            <select value={form.kidId} onChange={(e) => setForm({ ...form, kidId: e.target.value })}
              className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm outline-none focus:border-teal-300">
              {kids.map(k => <option key={k.id} value={k.id}>{k.name}</option>)}
            </select>
            <input placeholder="Title" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })}
              className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm outline-none focus:border-teal-300" />
            <textarea placeholder="Brief description" value={form.brief} onChange={(e) => setForm({ ...form, brief: e.target.value })} rows={2}
              className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm outline-none focus:border-teal-300 resize-none" />
            <div className="flex gap-2">
              <input type="number" value={form.points} onChange={(e) => setForm({ ...form, points: e.target.value })}
                className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm w-24 outline-none focus:border-teal-300" />
              <select value={form.difficulty} onChange={(e) => setForm({ ...form, difficulty: e.target.value })}
                className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm flex-1 outline-none focus:border-teal-300">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
              </select>
            </div>
            <button onClick={submit} className="bg-teal-400 text-slate-900 font-semibold rounded py-1.5 text-sm mt-1">Add task</button>
          </div>
        </Panel>
      )}
      <div className="grid gap-2">
        {tasks.map(t => {
          const d = DIFFICULTY[t.difficulty];
          return (
            <div key={t.id} className="flex items-center justify-between border border-slate-700/50 rounded px-3 py-2">
              <div>
                <div className="text-sm text-slate-200">{t.title}</div>
                <div className="text-xs font-mono" style={{ color: d.color }}>{d.label} · {t.points}pt · {kidName(kids, t.kidId)}</div>
              </div>
              <button onClick={() => onDeleteTask(t.id)} className="text-slate-500 hover:text-red-400"><IconTrash size={15} /></button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// A completed submission's code/snapshot/explanation stayed hidden once
// reviewed — this makes past work reviewable and runnable again, same as
// pending work already is, just without the approve/reject actions since
// that decision is already made.
function HistoryCard({ s, kids }) {
  const [expanded, setExpanded] = useState(false);
  return (
    <div className="border border-slate-700/50 rounded px-3 py-2 text-sm">
      <button onClick={() => setExpanded(!expanded)} className="w-full flex items-center justify-between text-left">
        <span className="flex items-center gap-2">
          {s.status === "approved" ? <IconCheck size={14} className="text-teal-300" /> : <IconX size={14} className="text-red-400" />}
          {s.title} <span className="font-mono text-xs text-slate-500">({kidName(kids, s.kidId)})</span>
        </span>
        <span className="flex items-center gap-2">
          <span className="font-mono text-xs text-slate-400">{s.status === "approved" ? ("+" + s.points) : "sent back"}</span>
          <IconBack size={12} className={"text-slate-500 transition-transform " + (expanded ? "-rotate-90" : "rotate-180")} />
        </span>
      </button>
      {expanded && (
        <div className="mt-3 pt-3 border-t border-slate-700/50">
          {s.explanation && (
            <div className="text-sm text-slate-400 italic mb-3 border-l-2 border-slate-600 pl-3">"{s.explanation}"</div>
          )}
          <RunnableSubmission s={s} targetPrefix="history-target-" />
          {s.reviewNote && (
            <div className="text-xs font-mono text-slate-400 bg-slate-800/60 border border-slate-700 rounded p-2">Note: {s.reviewNote}</div>
          )}
        </div>
      )}
    </div>
  );
}

function HistoryTab({ submissions, redemptions, kids }) {
  const reviewed = submissions.filter(s => s.status !== "pending")
    .sort((a, b) => new Date(b.reviewedAt || b.submittedAt) - new Date(a.reviewedAt || a.submittedAt));
  return (
    <div className="grid gap-4">
      <div>
        <div className="font-mono text-xs text-slate-500 tracking-widest mb-2">SUBMISSIONS</div>
        <div className="grid gap-2">
          {reviewed.map(s => <HistoryCard key={s.id} s={s} kids={kids} />)}
          {reviewed.length === 0 && <div className="text-slate-500 text-sm italic">No reviewed submissions yet.</div>}
        </div>
      </div>
      <div>
        <div className="font-mono text-xs text-slate-500 tracking-widest mb-2">REDEMPTIONS</div>
        <div className="grid gap-2">
          {redemptions.slice().reverse().map(r => (
            <div key={r.id} className="flex items-center justify-between border border-slate-700/50 rounded px-3 py-2 text-sm">
              <span className="flex items-center gap-2 text-slate-300"><IconAward size={14} className="text-amber-400" /> {r.date} <span className="font-mono text-xs text-slate-500">({kidName(kids, r.kidId)})</span></span>
              <span className="font-mono text-xs text-amber-400">{r.minutes}m (−{r.points}pt)</span>
            </div>
          ))}
          {redemptions.length === 0 && <div className="text-slate-500 text-sm italic">No redemptions yet.</div>}
        </div>
      </div>
    </div>
  );
}

function SettingsTab({ settings, kids, onUpdateSettings, onUpdateKid }) {
  const [local, setLocal] = useState(settings);
  const [newPin, setNewPin] = useState("");
  const [kidPins, setKidPins] = useState({});
  const [kidAvatars, setKidAvatars] = useState({});

  async function pickAvatar(kidId, file) {
    if (!file) return;
    const dataUrl = await readImageAsResizedDataUrl(file);
    setKidAvatars({ ...kidAvatars, [kidId]: dataUrl });
  }

  function save() {
    const payload = { ...local };
    if (newPin.trim()) payload.parentPin = newPin.trim();
    onUpdateSettings(payload);
    setNewPin("");
    kids.forEach(kid => {
      const fields = {};
      if ((kidPins[kid.id] || "").trim()) fields.pin = kidPins[kid.id].trim();
      if (kidAvatars[kid.id]) fields.avatar = kidAvatars[kid.id];
      if (Object.keys(fields).length > 0) onUpdateKid(kid.id, fields);
    });
    setKidPins({});
    setKidAvatars({});
  }
  return (
    <Panel className="grid gap-4 max-w-sm">
      <div>
        <label className="text-xs font-mono text-slate-400 block mb-1">Points per minute of screen time</label>
        <input type="number" value={local.pointsPerMinute} onChange={(e) => setLocal({ ...local, pointsPerMinute: Number(e.target.value) })}
          className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm w-full outline-none focus:border-teal-300" />
      </div>
      <div>
        <label className="text-xs font-mono text-slate-400 block mb-1">Daily redemption cap (minutes)</label>
        <input type="number" value={local.dailyCapMinutes} onChange={(e) => setLocal({ ...local, dailyCapMinutes: Number(e.target.value) })}
          className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm w-full outline-none focus:border-teal-300" />
      </div>
      <div>
        <label className="text-xs font-mono text-slate-400 block mb-1">New parent PIN (leave blank to keep current)</label>
        <input value={newPin} onChange={(e) => setNewPin(e.target.value)} placeholder="••••"
          className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm w-full outline-none focus:border-teal-300" />
      </div>
      {kids.map(kid => (
        <div key={kid.id} className="border-t border-slate-700/50 pt-4">
          <div className="flex items-center gap-3 mb-2">
            {(kidAvatars[kid.id] || kid.avatar) ? (
              <img src={kidAvatars[kid.id] || kid.avatar} alt={kid.name} className="w-10 h-10 rounded-full object-cover border border-slate-600" />
            ) : (
              <div className="w-10 h-10 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center">
                <IconZap size={16} className="text-teal-300" />
              </div>
            )}
            <span className="text-sm text-slate-300">{kid.name}</span>
          </div>
          <label className="text-xs font-mono text-slate-400 block mb-1">Photo</label>
          <input type="file" accept="image/*" onChange={(e) => pickAvatar(kid.id, e.target.files[0])}
            className="text-xs text-slate-400 mb-3 block w-full file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-slate-700 file:text-slate-200 file:text-xs" />
          <label className="text-xs font-mono text-slate-400 block mb-1">New PIN for {kid.name} (leave blank to keep current)</label>
          <input value={kidPins[kid.id] || ""} onChange={(e) => setKidPins({ ...kidPins, [kid.id]: e.target.value })} placeholder="••••"
            className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm w-full outline-none focus:border-teal-300" />
        </div>
      ))}
      <button onClick={save} className="bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold rounded py-2 text-sm">
        Save settings
      </button>
    </Panel>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
