// Pulls together everything a kid has already done or started: approved
// submissions (COMPLETED) and localStorage drafts with real content
// (SAVED), split into the same Mystery Quests / Fundamentals Practice
// categories the Quest and Learn tabs already use. Reuses SubmitModal
// (to resume a draft) and CompletedDetail (to review finished work)
// rather than building new viewers for either.
function HistoryPanel({ kidId, kidTasks, approved, onSubmit }) {
  const [viewingCompleted, setViewingCompleted] = useState(null);
  const [activeTask, setActiveTask] = useState(null);
  const [explanation, setExplanation] = useState("");
  const [code, setCode] = useState("");
  const [pasted, setPasted] = useState(false);

  function categoryOf(task) {
    return task && task.difficulty === "fundamentals" ? "Fundamentals Practice" : "Mystery Quests";
  }

  // Drafts aren't tracked in any React state upstream -- they live only
  // in localStorage (see saveDraft/loadDraft) -- so this scans for keys
  // belonging to this kid rather than reading from a prop. Skips a
  // draft that's empty or still just the untouched starter code, so an
  // opened-but-never-typed-in task doesn't show up as "unfinished work."
  const drafts = [];
  try {
    const prefix = "codequest:draft:" + kidId + ":";
    for (let i = 0; i < localStorage.length; i++) {
      const key = localStorage.key(i);
      if (!key || !key.startsWith(prefix)) continue;
      const taskId = key.slice(prefix.length);
      const task = kidTasks.find(t => t.id === taskId);
      if (!task) continue;
      let draft;
      try { draft = JSON.parse(localStorage.getItem(key)); } catch (e) { continue; }
      const blankDefault = task.vehicle === "judge" ? DEFAULT_CODE_JUDGE : DEFAULT_CODE_TURTLE;
      if (!draft || !draft.code || draft.code.trim() === "" || draft.code === blankDefault) continue;
      drafts.push({ task, draft });
    }
  } catch (e) {}

  function startResume(task, draft) {
    setExplanation(draft.explanation || "");
    setCode(draft.code || "");
    setPasted(draft.pasted || false);
    setActiveTask(task);
  }

  useEffect(() => {
    if (!activeTask) return;
    saveDraft(kidId, activeTask.id, { code, explanation, pasted });
  }, [code, explanation, pasted, activeTask, kidId]);

  function groupBy(items, keyFn) {
    const groups = {};
    items.forEach(item => { const k = keyFn(item); (groups[k] = groups[k] || []).push(item); });
    return groups;
  }
  const CATEGORY_ORDER = ["Mystery Quests", "Fundamentals Practice"];
  const draftGroups = groupBy(drafts, d => categoryOf(d.task));
  const completedGroups = groupBy(approved, s => categoryOf(kidTasks.find(t => t.id === s.taskId)));

  return (
    <div className="space-y-6">
      {drafts.length > 0 && (
        <div>
          <div className="font-mono text-xs text-slate-400 tracking-widest mb-2">SAVED (UNFINISHED)</div>
          {CATEGORY_ORDER.filter(cat => draftGroups[cat]).map(cat => (
            <div key={cat} className="mb-3">
              <div className="text-xs text-slate-500 font-mono mb-1">{cat}</div>
              {draftGroups[cat].map(({ task, draft }) => (
                <button key={task.id} onClick={() => startResume(task, draft)}
                  className="w-full flex items-center justify-between py-2 px-2 border-b border-slate-700/50 last:border-0 text-left hover:bg-slate-800/30 rounded">
                  <span className="text-slate-300 text-sm">{task.title}</span>
                  <span className="font-mono text-xs text-amber-400">Resume</span>
                </button>
              ))}
            </div>
          ))}
        </div>
      )}

      {approved.length > 0 && (
        <div>
          <div className="font-mono text-xs text-slate-400 tracking-widest mb-2">COMPLETED ({approved.length})</div>
          {CATEGORY_ORDER.filter(cat => completedGroups[cat]).map(cat => (
            <div key={cat} className="mb-3">
              <div className="text-xs text-slate-500 font-mono mb-1">{cat}</div>
              <div className="grid grid-cols-3 gap-2">
                {completedGroups[cat].map(s => (
                  <button key={s.id} onClick={() => setViewingCompleted(s)} className="flex flex-col items-center gap-1 text-left">
                    {s.snapshot ? (
                      <img src={s.snapshot} alt={s.title} className="w-full aspect-square object-contain bg-white rounded border border-slate-700/50 hover:border-teal-300/60 transition-colors" />
                    ) : (
                      <div className="w-full aspect-square flex items-center justify-center bg-slate-900/40 rounded border border-slate-700/50 hover:border-teal-300/60 transition-colors">
                        <IconCheck size={20} className="text-teal-300" />
                      </div>
                    )}
                    <span className="text-xs text-slate-400 text-center leading-tight">{s.title}</span>
                    <span className="font-mono text-xs text-teal-300">+{s.points}</span>
                  </button>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}

      {drafts.length === 0 && approved.length === 0 && (
        <div className="text-sm text-slate-500 font-mono py-6 text-center">Nothing here yet -- finish or save a task and it'll show up.</div>
      )}

      {activeTask && (
        <SubmitModal task={activeTask} explanation={explanation} setExplanation={setExplanation}
          code={code} setCode={setCode} onPasteDetected={() => setPasted(true)}
          onSave={() => saveDraft(kidId, activeTask.id, { code, explanation, pasted })}
          onCancel={() => { clearDraft(kidId, activeTask.id); setActiveTask(null); setExplanation(""); setCode(""); setPasted(false); }}
          onSubmit={(snapshot) => { clearDraft(kidId, activeTask.id); onSubmit(activeTask.id, explanation, code, snapshot, pasted); setActiveTask(null); setExplanation(""); setCode(""); setPasted(false); }} />
      )}

      {viewingCompleted && (
        <CompletedDetail submission={viewingCompleted} onBack={() => setViewingCompleted(null)} />
      )}
    </div>
  );
}

// Cross-family by design -- the only place in this app where a kid sees
// another family's data (just a handle + a points total, nothing else).
// Joining while already on a team asks for confirmation first so a
// mistyped code doesn't silently bump you out of a team you like.
function CommunityPanel({ team, teamError, onCreateTeam, onJoinTeam, onLeaveTeam }) {
  const [name, setName] = useState("");
  const [goalPoints, setGoalPoints] = useState(100);
  const [joinCode, setJoinCode] = useState("");
  const [confirmSwitch, setConfirmSwitch] = useState(null); // null | "create" | "join"

  function attemptCreate() {
    if (!name.trim()) return;
    if (team) { setConfirmSwitch("create"); return; }
    onCreateTeam(name.trim(), Number(goalPoints) || 0);
    setName("");
  }
  function attemptJoin() {
    if (!joinCode.trim()) return;
    if (team) { setConfirmSwitch("join"); return; }
    onJoinTeam(joinCode.trim());
    setJoinCode("");
  }
  function confirmYes() {
    if (confirmSwitch === "create") { onCreateTeam(name.trim(), Number(goalPoints) || 0); setName(""); }
    if (confirmSwitch === "join") { onJoinTeam(joinCode.trim()); setJoinCode(""); }
    setConfirmSwitch(null);
  }

  if (!team) {
    return (
      <div className="space-y-4">
        {teamError && <div className="text-sm text-red-300 font-mono">{teamError}</div>}
        <Panel>
          <div className="font-mono text-xs text-slate-400 tracking-widest mb-3">JOIN A TEAM</div>
          <div className="flex gap-2">
            <input value={joinCode} onChange={(e) => setJoinCode(e.target.value)} placeholder="Team code"
              className="flex-1 bg-slate-900/60 border border-slate-700/50 rounded px-3 py-2 text-sm font-mono uppercase" />
            <button onClick={attemptJoin} className="bg-teal-500 hover:bg-teal-400 text-slate-900 font-semibold rounded px-4 text-sm transition-colors">Join</button>
          </div>
        </Panel>
        <Panel>
          <div className="font-mono text-xs text-slate-400 tracking-widest mb-3">START A TEAM</div>
          <div className="space-y-2">
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Team name"
              className="w-full bg-slate-900/60 border border-slate-700/50 rounded px-3 py-2 text-sm" />
            <div className="flex items-center gap-2">
              <span className="text-xs text-slate-500 font-mono">Goal:</span>
              <input type="number" min={1} value={goalPoints} onChange={(e) => setGoalPoints(e.target.value)}
                className="w-24 bg-slate-900/60 border border-slate-700/50 rounded px-3 py-1.5 text-sm font-mono" />
              <span className="text-xs text-slate-500 font-mono">points</span>
            </div>
            <button onClick={attemptCreate} className="w-full bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold rounded py-2 text-sm transition-colors">Create Team</button>
          </div>
        </Panel>
      </div>
    );
  }

  const totalPoints = team.leaderboard.reduce((sum, m) => sum + m.points, 0);
  const pct = team.goalPoints > 0 ? Math.min(100, Math.round((totalPoints / team.goalPoints) * 100)) : 0;

  return (
    <div className="space-y-4">
      {teamError && <div className="text-sm text-red-300 font-mono">{teamError}</div>}
      <Panel>
        <div className="flex items-center justify-between mb-1">
          <div className="font-semibold text-slate-100">{team.name}</div>
          <div className="font-mono text-xs text-slate-500">code: {team.code}</div>
        </div>
        <div className="text-xs text-slate-500 font-mono mb-2">{totalPoints} / {team.goalPoints} points{pct >= 100 ? " -- GOAL REACHED! 🎉" : ""}</div>
        <div className="h-2 bg-slate-900/60 rounded overflow-hidden">
          <div className="h-full bg-teal-400 transition-all" style={{ width: pct + "%" }} />
        </div>
      </Panel>
      <Panel>
        <div className="font-mono text-xs text-slate-400 tracking-widest mb-3">LEADERBOARD</div>
        {team.leaderboard.map((m, i) => (
          <div key={m.handle} className="flex items-center justify-between py-1.5 border-b border-slate-700/50 last:border-0">
            <span className="text-sm text-slate-300 font-mono">{i + 1}. {m.handle}</span>
            <span className="font-mono text-xs text-teal-300">{m.points}</span>
          </div>
        ))}
      </Panel>
      <button onClick={onLeaveTeam} className="text-xs text-slate-500 hover:text-red-300 font-mono">Leave team</button>

      {confirmSwitch && (
        <div className="fixed inset-0 z-[60] flex items-center justify-center bg-black/60 px-4">
          <div className="bg-slate-800 border border-slate-600 rounded-lg p-5 max-w-sm">
            <div className="text-sm text-slate-200 mb-4">You're already on team "{team.name}" -- switch to the new one instead?</div>
            <div className="flex gap-3 justify-end">
              <button onClick={() => setConfirmSwitch(null)} className="text-sm text-slate-400 hover:text-slate-200">Cancel</button>
              <button onClick={confirmYes} className="text-sm bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold rounded px-3 py-1.5">Yes, switch</button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// Streak + heatmap are computed entirely client-side from submissions
// already loaded for the Quest/Learn tabs -- no separate fetch needed.
function MePanel({ submissions, onLogout }) {
  const days = submissions.map(s => s.submittedAt.slice(0, 10));
  const counts = {};
  days.forEach(d => { counts[d] = (counts[d] || 0) + 1; });

  let streak = 0;
  let cursor = new Date();
  // If nothing submitted yet today, start counting from yesterday so an
  // in-progress day doesn't zero out a streak earned on prior days.
  if (!counts[todayStr()]) cursor.setDate(cursor.getDate() - 1);
  while (true) {
    const key = cursor.toISOString().slice(0, 10);
    if (!counts[key]) break;
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }

  const WEEKS = 14;
  const cells = [];
  const start = new Date();
  start.setDate(start.getDate() - (WEEKS * 7 - 1));
  for (let i = 0; i < WEEKS * 7; i++) {
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const key = d.toISOString().slice(0, 10);
    cells.push({ key, count: counts[key] || 0 });
  }
  function shade(count) {
    if (count === 0) return "bg-slate-800/60";
    if (count === 1) return "bg-teal-900";
    if (count === 2) return "bg-teal-700";
    return "bg-teal-400";
  }

  return (
    <div className="space-y-4">
      <Panel>
        <div className="font-mono text-xs text-slate-400 tracking-widest mb-2">STREAK</div>
        <div className="text-3xl font-semibold text-amber-300">{streak} <span className="text-sm text-slate-500 font-normal">day{streak === 1 ? "" : "s"}</span></div>
      </Panel>
      <Panel>
        <div className="font-mono text-xs text-slate-400 tracking-widest mb-3">ACTIVITY</div>
        <div className="grid grid-flow-col grid-rows-7 gap-1 overflow-x-auto">
          {cells.map(c => (
            <div key={c.key} title={c.key + ": " + c.count} className={"w-3 h-3 rounded-sm " + shade(c.count)} />
          ))}
        </div>
      </Panel>
      <button onClick={onLogout} className="w-full bg-slate-700 hover:bg-slate-600 text-slate-200 font-semibold rounded py-2 text-sm transition-colors">Log out</button>
    </div>
  );
}

// Full-screen slide-in for a kid's own completed work — same GRID_BG/
// TopBar treatment as SubmitModal, so tapping into and out of a task
// feels consistent whether it's still open or already done. Read-only:
// reuses RunnableSubmission (snapshot/code/Run/output) with no approve/
// reject actions, since a completed task has nothing left to decide.
function CompletedDetail({ submission, onBack }) {
  const [entered, setEntered] = useState(false);
  useEffect(() => {
    const id = requestAnimationFrame(() => setEntered(true));
    return () => cancelAnimationFrame(id);
  }, []);
  return (
    <div className="fixed inset-0 z-50 overflow-y-auto">
      <div style={GRID_BG}
        className={"transition-transform duration-300 ease-out " + (entered ? "translate-x-0" : "translate-x-full")}>
        <div className="max-w-2xl mx-auto px-4 py-6 pb-16 text-slate-100">
          <TopBar onBack={onBack} backLabel="Back" label={submission.title.toUpperCase()} />
          <Panel className="mb-4">
            <div className="flex items-center justify-between mb-1">
              <div className="font-semibold text-slate-100">{submission.title}</div>
              <span className="font-mono text-teal-300 text-sm">+{submission.points}</span>
            </div>
            {submission.explanation && (
              <div className="text-sm text-slate-400 italic mt-2 border-l-2 border-slate-600 pl-3">"{submission.explanation}"</div>
            )}
          </Panel>
          <Panel>
            <RunnableSubmission s={submission} targetPrefix="completed-target-" />
          </Panel>
        </div>
      </div>
    </div>
  );
}

function TopBar({ onBack, label, backLabel = "Switch" }) {
  return (
    <div className="flex items-center justify-between mb-6">
      <button onClick={onBack} className="text-slate-400 hover:text-slate-200 flex items-center gap-1 text-sm">
        <IconBack size={15} /> {backLabel}
      </button>
      <div className="font-mono text-xs tracking-widest text-amber-400 flex items-center gap-1">
        <IconTerminal size={13} /> {label}
      </div>
    </div>
  );
}

function Section({ label, children }) {
  return (
    <div className="mb-6">
      <div className="font-mono text-xs text-slate-500 tracking-widest mb-2">{label}</div>
      {children}
    </div>
  );
}

function SubmitModal({ task, explanation, setExplanation, code, setCode, onCancel, onSubmit, onPasteDetected, onSave, tip }) {
  const isJudge = task.vehicle === "judge";
  const [hasRun, setHasRun] = useState(false);
  const [running, setRunning] = useState(false);
  const [output, setOutput] = useState("");
  const [runError, setRunError] = useState(null);
  const [stopped, setStopped] = useState(false);
  const [entered, setEntered] = useState(false);
  const [showTip, setShowTip] = useState(false);
  const [testResults, setTestResults] = useState([]);
  const [showConfirmBack, setShowConfirmBack] = useState(false);
  const [justSaved, setJustSaved] = useState(false);

  // The draft is already saved continuously (every code/explanation
  // keystroke, via the parent's own effect) -- this button doesn't add
  // new persistence, it gives the kid an explicit, reassuring moment of
  // "yes, this is saved" rather than only ever happening silently.
  function handleSave() {
    onSave();
    setJustSaved(true);
    setTimeout(() => setJustSaved(false), 1500);
  }
  // A ref, not state: handleRun's in-flight async closure needs the live
  // value at the moment runPython's promise settles, not the value from
  // when Run was clicked — state would be stale inside that closure.
  const stoppedRef = useRef(false);
  const allTestsPassed = testResults.length > 0 && testResults.every(r => r.passed);
  // Judge tasks gate Submit on every test case actually passing (the
  // whole point of automated grading) rather than just "ran once" --
  // turtle tasks keep the original looser gate.
  const canSubmit = isJudge
    ? explanation.trim().length >= 10 && allTestsPassed
    : explanation.trim().length >= 10 && hasRun;

  // Slide in from the right on mount rather than popping up as a dialog —
  // this is a detail page, not a modal, so it gets the same full-screen
  // treatment as the rest of the app (opaque GRID_BG, no dimmed backdrop).
  useEffect(() => {
    const id = requestAnimationFrame(() => setEntered(true));
    return () => cancelAnimationFrame(id);
  }, []);

  async function handleRun() {
    setRunning(true);
    setRunError(null);
    setStopped(false);
    stoppedRef.current = false;
    if (isJudge) {
      setTestResults([]);
      try {
        const results = await runJudgeTestCases(code, task.testCases || []);
        setTestResults(results);
      } catch (e) {
        setRunError(e.message || String(e));
      } finally {
        setHasRun(true);
        setRunning(false);
      }
      return;
    }
    let out = "";
    setOutput("");
    try {
      const result = await runPython(code, "turtle-target", (text) => { out += text; setOutput(out); });
      if (!result.ok && !stoppedRef.current) setRunError(result.error);
    } catch (e) {
      if (!stoppedRef.current) setRunError(e.message || String(e));
    } finally {
      setHasRun(true);
      setRunning(false);
    }
  }

  // Skulpt periodically checks elapsed time against Sk.execLimit and
  // throws its own TimeLimitError when exceeded (verified directly
  // against the library) — forcing it to 0 mid-run trips that check at
  // the next yield point instead of waiting out the normal 30s ceiling.
  // Safe to mutate globally: only one run is ever in flight in this UI,
  // and runPython's Sk.configure(...) resets execLimit on every call.
  function handleStop() {
    setStopped(true);
    stoppedRef.current = true;
    Sk.execLimit = 0;
  }

  function handleSubmit() {
    onSubmit(captureCanvasSnapshot("turtle-target"));
  }

  return (
    <div className="fixed inset-0 z-50 overflow-y-auto">
      <div style={GRID_BG}
        className={"transition-transform duration-300 ease-out " + (entered ? "translate-x-0" : "translate-x-full")}>
        <div className="max-w-3xl mx-auto px-4 py-6 pb-16 text-slate-100">
          <TopBar onBack={() => setShowConfirmBack(true)} backLabel="Back" label={task.title.toUpperCase()} />

          <Panel className="mb-4">
            <div className="font-semibold text-slate-100 mb-1">{task.title}</div>
            <div className="text-xs text-slate-500 font-mono mb-3">Worth {task.points} points</div>
            <div className="text-sm text-slate-400">{task.brief}</div>
          </Panel>

          <div className="mb-4">
            <div className="flex items-center justify-between mb-2">
              <label className="text-sm text-slate-300">Your code</label>
              <div className="flex items-center gap-3">
                <button onClick={handleSave}
                  className={"text-xs font-mono flex items-center gap-1 " + (justSaved ? "text-teal-300" : "text-slate-400 hover:text-slate-200")}>
                  {justSaved ? "✓ Saved" : "💾 Save"}
                </button>
                {tip && (
                  <button onClick={() => setShowTip(v => !v)}
                    className="text-xs font-mono text-amber-300 hover:text-amber-200 flex items-center gap-1">
                    💡 {showTip ? "Hide tip" : "Tip"}
                  </button>
                )}
              </div>
            </div>
            {tip && showTip && (
              <div className="mb-2 rounded border border-amber-400/30 bg-amber-500/10 px-3 py-2 text-xs text-amber-100">
                <div className="font-semibold mb-1">{tip.title}</div>
                <div className="mb-2">{tip.tip}</div>
                <pre className="font-mono text-amber-200 whitespace-pre-wrap">{tip.code}</pre>
              </div>
            )}
            <Editor value={code} onChange={setCode} onPasteDetected={onPasteDetected} />
            {running ? (
              isJudge ? (
                <button disabled
                  className="mt-2 w-full bg-slate-700 text-slate-400 font-semibold rounded py-2 text-sm flex items-center justify-center gap-1">
                  Running tests...
                </button>
              ) : (
                <button onClick={handleStop}
                  className="mt-2 w-full bg-red-500 hover:bg-red-400 text-white font-semibold rounded py-2 text-sm flex items-center justify-center gap-1">
                  ■ Stop
                </button>
              )
            ) : (
              <button onClick={handleRun}
                className="mt-2 w-full bg-teal-400 text-slate-900 font-semibold rounded py-2 text-sm flex items-center justify-center gap-1">
                <IconZap size={14} /> Run
              </button>
            )}
          </div>

          {!isJudge && (
            <div className="mb-4">
              <label className="text-sm text-slate-300 mb-2 block">Your drawing</label>
              <div id="turtle-target" tabIndex={0}
                className="w-full bg-white rounded border border-slate-600 outline-none"
                style={{ minHeight: 420 }} />
            </div>
          )}

          {isJudge ? (
            <div className="mb-4">
              <label className="text-sm text-slate-300 mb-2 block">Test Results</label>
              {testResults.length === 0 ? (
                <div className="font-mono text-xs rounded border border-slate-700 bg-slate-950/60 px-3 py-2 text-slate-500 italic">
                  No results yet — click Run.
                </div>
              ) : (
                <div className="space-y-2">
                  {testResults.map((r, i) => (
                    <div key={i} className={"font-mono text-xs rounded border px-3 py-2 " +
                      (r.passed ? "bg-teal-500/10 border-teal-400/40" : "bg-red-500/10 border-red-400/40")}>
                      <div className={r.passed ? "text-teal-300" : "text-red-300"}>
                        {r.passed ? "✓" : "✗"} Test {i + 1}
                      </div>
                      {/* Echo each input() value as a terminal would, so it's
                          visibly clear something really was typed in before
                          any output showed up -- otherwise a judge task's
                          silent scripted input looks indistinguishable from
                          no input happening at all. */}
                      {r.input.map((v, j) => (
                        <div key={j} className="text-cyan-300/80 mt-1 first:mt-1.5">&gt; {v}</div>
                      ))}
                      {r.passed ? (
                        <div className="text-slate-400 mt-1 whitespace-pre-wrap">{r.actual}</div>
                      ) : (
                        <>
                          <div className="text-slate-400 mt-1 whitespace-pre-wrap">expected: {r.expected}</div>
                          <div className="text-slate-400 whitespace-pre-wrap">got: {r.error ? r.error : (r.actual || "(nothing printed)")}</div>
                        </>
                      )}
                    </div>
                  ))}
                </div>
              )}
            </div>
          ) : (
            <div className="mb-4">
              <label className="text-sm text-slate-300 mb-2 block">Output</label>
              <div className={"font-mono text-xs rounded border overflow-y-auto " +
                (stopped ? "bg-amber-500/10 border-amber-400/40"
                 : runError ? "bg-red-500/10 border-red-400/40"
                 : "bg-slate-950/60 border-slate-700")}
                style={{ minHeight: 140, maxHeight: 260 }}>
                {stopped ? (
                  <div className="px-3 py-1.5 text-amber-300">Stopped.</div>
                ) : runError ? (
                  <div className="px-3 py-1.5 text-red-300">Your code hit a snag: {runError}</div>
                ) : output ? (
                  output.split("\n").map((line, i) => (
                    <div key={i} className="px-3 py-1.5 text-slate-300 border-b border-slate-800/60 last:border-0 whitespace-pre-wrap">{line}</div>
                  ))
                ) : (
                  <div className="px-3 py-1.5 text-slate-500 italic">Nothing printed yet — click Run.</div>
                )}
              </div>
            </div>
          )}

          <Panel>
            <label className="text-sm text-slate-300 mb-2 block">In your own words — what does your code do?</label>
            <textarea value={explanation} onChange={(e) => setExplanation(e.target.value)} rows={3}
              placeholder="Explain it like Dad hasn't seen it..."
              className="w-full bg-slate-800 border border-slate-600 rounded p-3 text-sm text-slate-100 outline-none focus:border-teal-300 resize-none mb-4" />

            <button disabled={!canSubmit} onClick={handleSubmit}
              className="w-full bg-teal-400 disabled:bg-slate-700 disabled:text-slate-500 text-slate-900 font-semibold rounded py-2 text-sm flex items-center justify-center gap-1">
              <IconSend size={14} /> Submit
            </button>
            {isJudge ? (
              !allTestsPassed && (
                <div className="text-xs text-slate-500 font-mono mt-2 text-center">
                  {testResults.length === 0 ? "Run your code to check it against the test cases." : "All test cases must pass before submitting."}
                </div>
              )
            ) : (
              !hasRun && (
                <div className="text-xs text-slate-500 font-mono mt-2 text-center">Run your code at least once before submitting.</div>
              )
            )}
          </Panel>
        </div>
      </div>
      {showConfirmBack && (
        <div className="fixed inset-0 z-[60] bg-slate-950/70 flex items-center justify-center px-6">
          <Panel className="w-full max-w-xs flex flex-col gap-4 text-center">
            <div className="text-sm text-slate-100">Are you sure you want to delete your code?</div>
            <div className="flex gap-2">
              <button onClick={onCancel}
                className="flex-1 bg-red-500 hover:bg-red-400 text-white font-semibold rounded py-2 text-sm">
                Yes
              </button>
              <button onClick={() => setShowConfirmBack(false)}
                className="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-100 font-semibold rounded py-2 text-sm">
                Cancel
              </button>
            </div>
          </Panel>
        </div>
      )}
    </div>
  );
}

function kidName(kids, kidId) {
  const k = kids.find(k => k.id === kidId);
  return k ? k.name : kidId;
}

function ParentView({ kids, tasks, suggestions, submissions, redemptions, settings, onReview, onAddTask, onDeleteTask, onApproveSuggestion, onRejectSuggestion, onUpdateSettings, onUpdateKid, onAddKid, familyName, onBack }) {
  // A brand-new family has zero kids -- land straight on Settings
  // (where "add a kid" now lives) instead of an emptily-blank Review
  // tab. Lazy initializer only, so this doesn't yank the parent back
  // to Settings later just because kids briefly re-renders empty.
  const [tab, setTab] = useState(() => (kids.length === 0 ? "settings" : "review"));
  const pending = submissions.filter(s => s.status === "pending");
  const tabCount = { review: pending.length, suggestions: suggestions.length };
  return (
    <div className="max-w-2xl mx-auto px-4 py-6 pb-16">
      <TopBar onBack={onBack} label="PARENT" />
      {familyName && <div className="text-xs font-mono text-slate-500 -mt-4 mb-4">{familyName}</div>}
      {kids.length === 0 && (
        <div className="mb-4 text-sm text-amber-300 font-mono bg-amber-500/10 border border-amber-400/30 rounded px-3 py-2">
          Add your first kid in the Settings tab to get started.
        </div>
      )}
      <div className="flex gap-1 mb-6 font-mono text-xs">
        {["review", "suggestions", "tasks", "history", "settings"].map(key => (
          <button key={key} onClick={() => setTab(key)}
            className={"px-3 py-1.5 rounded-t border-b-2 tracking-wide " + (tab === key ? "border-amber-400 text-amber-400" : "border-transparent text-slate-500 hover:text-slate-300")}>
            {key.toUpperCase()}{tabCount[key] > 0 ? " (" + tabCount[key] + ")" : ""}
          </button>
        ))}
      </div>
      {tab === "review" && <ReviewTab pending={pending} kids={kids} onReview={onReview} />}
      {tab === "suggestions" && <SuggestionsTab suggestions={suggestions} kids={kids} onApprove={onApproveSuggestion} onReject={onRejectSuggestion} />}
      {tab === "tasks" && <TasksTab tasks={tasks} kids={kids} onAddTask={onAddTask} onDeleteTask={onDeleteTask} />}
      {tab === "history" && <HistoryTab submissions={submissions} redemptions={redemptions} kids={kids} />}
      {tab === "settings" && <SettingsTab settings={settings} kids={kids} onUpdateSettings={onUpdateSettings} onUpdateKid={onUpdateKid} onAddKid={onAddKid} />}
    </div>
  );
}

function ReviewTab({ pending, kids, onReview }) {
  if (pending.length === 0) return <div className="text-slate-500 text-sm italic">Nothing waiting for review.</div>;
  return (
    <div className="grid gap-3">
      {pending.map(s => <ReviewCard key={s.id} s={s} kids={kids} onReview={onReview} />)}
    </div>
  );
}

// Shared by ReviewCard (pending work) and HistoryTab (already-decided
// work) — the snapshot/code/Run/output block is identical either way,
// only what surrounds it (approve/reject vs. nothing) differs.
function RunnableSubmission({ s, targetPrefix }) {
  const [running, setRunning] = useState(false);
  const [hasRun, setHasRun] = useState(false);
  const [output, setOutput] = useState("");
  const [runError, setRunError] = useState(null);
  const targetId = targetPrefix + s.id;

  async function handleRun() {
    setRunning(true);
    setRunError(null);
    setHasRun(true);
    let out = "";
    setOutput("");
    try {
      const result = await runPython(s.code || "", targetId, (text) => { out += text; setOutput(out); });
      if (!result.ok) setRunError(result.error);
    } catch (e) {
      setRunError(e.message || String(e));
    } finally {
      setRunning(false);
    }
  }

  return (
    <>
      {s.snapshot && (
        <img src={s.snapshot} alt={s.title} className="w-full max-w-xs mx-auto bg-white rounded border border-slate-700 mb-3" />
      )}
      {s.code && s.code.trim() && (
        <>
          {s.pasted && (
            <div className="text-xs font-mono text-amber-300 bg-amber-500/10 border border-amber-400/40 rounded px-2 py-1 mb-2 flex items-center gap-1">
              <IconAlert size={12} /> Some of this code was pasted in, not typed
            </div>
          )}
          <pre className={"text-xs font-mono text-teal-200 rounded p-3 mb-2 overflow-x-auto whitespace-pre-wrap border " +
            (s.pasted ? "bg-amber-950/20 border-amber-400/30" : "bg-slate-950/60 border-slate-700")}>{s.code}</pre>
          <button onClick={handleRun} disabled={running}
            className="w-full mb-3 border border-teal-400/40 text-teal-300 disabled:border-slate-700 disabled:text-slate-500 rounded py-1.5 text-sm flex items-center justify-center gap-1 hover:bg-teal-400/10">
            <IconZap size={13} /> {running ? "Running…" : "Run this code"}
          </button>
          {/* Always in the DOM (not gated on hasRun) — runPython needs to find
              this element synchronously when Run is clicked, before React
              has had a chance to flush the hasRun state update. Hidden via
              CSS instead of unmounting. */}
          <div className={hasRun ? "mb-3" : "hidden"}>
            <div id={targetId} tabIndex={0}
              className="w-full bg-white rounded border border-slate-600 outline-none mb-2"
              style={{ minHeight: 180 }} />
            {output && (
              <pre className="text-xs font-mono text-slate-300 bg-slate-950/60 border border-slate-700 rounded p-2 max-h-24 overflow-y-auto whitespace-pre-wrap">{output}</pre>
            )}
            {runError && (
              <div className="text-xs font-mono text-red-300 bg-red-500/10 border border-red-400/40 rounded p-2">{runError}</div>
            )}
          </div>
        </>
      )}
    </>
  );
}

function ReviewCard({ s, kids, onReview }) {
  const [note, setNote] = useState("");

  return (
    <Panel>
      <div className="flex items-center justify-between mb-2">
        <span className="font-semibold text-slate-100">{s.title} <span className="font-mono text-xs text-slate-500">({kidName(kids, s.kidId)})</span></span>
        <span className="font-mono text-teal-300 text-sm">+{s.points}</span>
      </div>
      <div className="text-sm text-slate-400 italic mb-3 border-l-2 border-slate-600 pl-3">"{s.explanation}"</div>
      <RunnableSubmission s={s} targetPrefix="review-target-" />
      <input placeholder="Optional note if sending back..." value={note}
        onChange={(e) => setNote(e.target.value)}
        className="w-full bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-xs text-slate-200 outline-none focus:border-slate-400 mb-3" />
      <div className="flex gap-2">
        <button onClick={() => onReview(s.id, "rejected", note)}
          className="flex-1 border border-red-400/40 text-red-300 rounded py-1.5 text-sm flex items-center justify-center gap-1 hover:bg-red-400/10">
          <IconRedo size={13} /> Send back
        </button>
        <button onClick={() => onReview(s.id, "approved", "")}
          className="flex-1 bg-teal-400 text-slate-900 font-semibold rounded py-1.5 text-sm flex items-center justify-center gap-1">
          <IconCheck size={13} /> Approve
        </button>
      </div>
    </Panel>
  );
}

function SuggestionsTab({ suggestions, kids, onApprove, onReject }) {
  if (suggestions.length === 0) return <div className="text-slate-500 text-sm italic">No agent-proposed tasks waiting for review.</div>;
  return (
    <div className="grid gap-3">
      {suggestions.map(t => {
        const d = DIFFICULTY[t.difficulty];
        return (
          <Panel key={t.id}>
            <div className="flex items-center justify-between mb-2">
              <span className="font-semibold text-slate-100">{t.title} <span className="font-mono text-xs text-slate-500">({kidName(kids, t.kidId)})</span></span>
              <span className="flex items-center gap-2">
                <span className="font-mono text-xs px-1.5 py-0.5 rounded" style={{ color: d.color, border: "1px solid " + d.color + "55" }}>{d.label}</span>
                <span className="font-mono text-teal-300 text-sm">+{t.points}</span>
              </span>
            </div>
            <div className="text-sm text-slate-400 mb-3">{t.brief}</div>
            {t.skills && t.skills.length > 0 && (
              <div className="flex flex-wrap gap-1 mb-3">
                {t.skills.map(s => (
                  <span key={s} className="font-mono text-xs px-1.5 py-0.5 rounded border border-slate-600 text-slate-400">{s}</span>
                ))}
              </div>
            )}
            <div className="flex gap-2">
              <button onClick={() => onReject(t.id)}
                className="flex-1 border border-red-400/40 text-red-300 rounded py-1.5 text-sm flex items-center justify-center gap-1 hover:bg-red-400/10">
                <IconX size={13} /> Reject
              </button>
              <button onClick={() => onApprove(t.id)}
                className="flex-1 bg-teal-400 text-slate-900 font-semibold rounded py-1.5 text-sm flex items-center justify-center gap-1">
                <IconCheck size={13} /> Approve
              </button>
            </div>
          </Panel>
        );
      })}
    </div>
  );
}

function TasksTab({ tasks, kids, onAddTask, onDeleteTask }) {
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState({ title: "", brief: "", points: 20, difficulty: "medium", kidId: kids[0]?.id || "" });
  function submit() {
    if (!form.title.trim() || !form.brief.trim() || !form.kidId) return;
    onAddTask({ ...form, points: Number(form.points) });
    setForm({ title: "", brief: "", points: 20, difficulty: "medium", kidId: kids[0]?.id || "" });
    setShowForm(false);
  }
  return (
    <div>
      <button onClick={() => setShowForm(!showForm)}
        className="mb-4 flex items-center gap-1 text-amber-400 font-mono text-xs border border-amber-400/40 rounded px-3 py-1.5 hover:bg-amber-400/10">
        <IconPlus size={14} /> New task
      </button>
      {showForm && (
        <Panel className="mb-4">
          <div className="grid gap-2">
            <select value={form.kidId} onChange={(e) => setForm({ ...form, kidId: e.target.value })}
              className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm outline-none focus:border-teal-300">
              {kids.map(k => <option key={k.id} value={k.id}>{k.name}</option>)}
            </select>
            <input placeholder="Title" value={form.title} onChange={(e) => setForm({ ...form, title: e.target.value })}
              className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm outline-none focus:border-teal-300" />
            <textarea placeholder="Brief description" value={form.brief} onChange={(e) => setForm({ ...form, brief: e.target.value })} rows={2}
              className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm outline-none focus:border-teal-300 resize-none" />
            <div className="flex gap-2">
              <input type="number" value={form.points} onChange={(e) => setForm({ ...form, points: e.target.value })}
                className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm w-24 outline-none focus:border-teal-300" />
              <select value={form.difficulty} onChange={(e) => setForm({ ...form, difficulty: e.target.value })}
                className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm flex-1 outline-none focus:border-teal-300">
                <option value="easy">Easy</option>
                <option value="medium">Medium</option>
                <option value="hard">Hard</option>
              </select>
            </div>
            <button onClick={submit} className="bg-teal-400 text-slate-900 font-semibold rounded py-1.5 text-sm mt-1">Add task</button>
          </div>
        </Panel>
      )}
      <div className="grid gap-2">
        {tasks.map(t => {
          const d = DIFFICULTY[t.difficulty];
          return (
            <div key={t.id} className="flex items-center justify-between border border-slate-700/50 rounded px-3 py-2">
              <div>
                <div className="text-sm text-slate-200">{t.title}</div>
                <div className="text-xs font-mono" style={{ color: d.color }}>{d.label} · {t.points}pt · {kidName(kids, t.kidId)}</div>
              </div>
              <button onClick={() => onDeleteTask(t.id)} className="text-slate-500 hover:text-red-400"><IconTrash size={15} /></button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// A completed submission's code/snapshot/explanation stayed hidden once
// reviewed — this makes past work reviewable and runnable again, same as
// pending work already is, just without the approve/reject actions since
// that decision is already made.
function HistoryCard({ s, kids }) {
  const [expanded, setExpanded] = useState(false);
  return (
    <div className="border border-slate-700/50 rounded px-3 py-2 text-sm">
      <button onClick={() => setExpanded(!expanded)} className="w-full flex items-center justify-between text-left">
        <span className="flex items-center gap-2">
          {s.status === "approved" ? <IconCheck size={14} className="text-teal-300" /> : <IconX size={14} className="text-red-400" />}
          {s.title} <span className="font-mono text-xs text-slate-500">({kidName(kids, s.kidId)})</span>
        </span>
        <span className="flex items-center gap-2">
          <span className="font-mono text-xs text-slate-400">{s.status === "approved" ? ("+" + s.points) : "sent back"}</span>
          <IconBack size={12} className={"text-slate-500 transition-transform " + (expanded ? "-rotate-90" : "rotate-180")} />
        </span>
      </button>
      {expanded && (
        <div className="mt-3 pt-3 border-t border-slate-700/50">
          {s.explanation && (
            <div className="text-sm text-slate-400 italic mb-3 border-l-2 border-slate-600 pl-3">"{s.explanation}"</div>
          )}
          <RunnableSubmission s={s} targetPrefix="history-target-" />
          {s.reviewNote && (
            <div className="text-xs font-mono text-slate-400 bg-slate-800/60 border border-slate-700 rounded p-2">Note: {s.reviewNote}</div>
          )}
        </div>
      )}
    </div>
  );
}

function HistoryTab({ submissions, redemptions, kids }) {
  const reviewed = submissions.filter(s => s.status !== "pending")
    .sort((a, b) => new Date(b.reviewedAt || b.submittedAt) - new Date(a.reviewedAt || a.submittedAt));
  return (
    <div className="grid gap-4">
      <div>
        <div className="font-mono text-xs text-slate-500 tracking-widest mb-2">SUBMISSIONS</div>
        <div className="grid gap-2">
          {reviewed.map(s => <HistoryCard key={s.id} s={s} kids={kids} />)}
          {reviewed.length === 0 && <div className="text-slate-500 text-sm italic">No reviewed submissions yet.</div>}
        </div>
      </div>
      <div>
        <div className="font-mono text-xs text-slate-500 tracking-widest mb-2">REDEMPTIONS</div>
        <div className="grid gap-2">
          {redemptions.slice().reverse().map(r => (
            <div key={r.id} className="flex items-center justify-between border border-slate-700/50 rounded px-3 py-2 text-sm">
              <span className="flex items-center gap-2 text-slate-300"><IconAward size={14} className="text-amber-400" /> {r.date} <span className="font-mono text-xs text-slate-500">({kidName(kids, r.kidId)})</span></span>
              <span className="font-mono text-xs text-amber-400">{r.minutes}m (−{r.points}pt)</span>
            </div>
          ))}
          {redemptions.length === 0 && <div className="text-slate-500 text-sm italic">No redemptions yet.</div>}
        </div>
      </div>
    </div>
  );
}

function SettingsTab({ settings, kids, onUpdateSettings, onUpdateKid, onAddKid }) {
  const [local, setLocal] = useState(settings);
  const [kidPins, setKidPins] = useState({});
  const [kidAvatars, setKidAvatars] = useState({});
  const [newKidName, setNewKidName] = useState("");

  async function pickAvatar(kidId, file) {
    if (!file) return;
    const dataUrl = await readImageAsResizedDataUrl(file);
    setKidAvatars({ ...kidAvatars, [kidId]: dataUrl });
  }

  function save() {
    onUpdateSettings(local);
    kids.forEach(kid => {
      const fields = {};
      if ((kidPins[kid.id] || "").trim()) fields.pin = kidPins[kid.id].trim();
      if (kidAvatars[kid.id]) fields.avatar = kidAvatars[kid.id];
      if (Object.keys(fields).length > 0) onUpdateKid(kid.id, fields);
    });
    setKidPins({});
    setKidAvatars({});
  }

  function addKid() {
    if (!newKidName.trim()) return;
    onAddKid(newKidName.trim());
    setNewKidName("");
  }

  return (
    <Panel className="grid gap-4 max-w-sm">
      <div>
        <label className="text-xs font-mono text-slate-400 block mb-1">Points per minute of screen time</label>
        <input type="number" value={local.pointsPerMinute} onChange={(e) => setLocal({ ...local, pointsPerMinute: Number(e.target.value) })}
          className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm w-full outline-none focus:border-teal-300" />
      </div>
      <div>
        <label className="text-xs font-mono text-slate-400 block mb-1">Daily redemption cap (minutes)</label>
        <input type="number" value={local.dailyCapMinutes} onChange={(e) => setLocal({ ...local, dailyCapMinutes: Number(e.target.value) })}
          className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm w-full outline-none focus:border-teal-300" />
      </div>
      {kids.map(kid => (
        <div key={kid.id} className="border-t border-slate-700/50 pt-4">
          <div className="flex items-center gap-3 mb-2">
            {(kidAvatars[kid.id] || kid.avatar) ? (
              <img src={kidAvatars[kid.id] || kid.avatar} alt={kid.name} className="w-10 h-10 rounded-full object-cover border border-slate-600" />
            ) : (
              <div className="w-10 h-10 rounded-full bg-slate-800 border border-slate-600 flex items-center justify-center">
                <IconZap size={16} className="text-teal-300" />
              </div>
            )}
            <div>
              <div className="text-sm text-slate-300">{kid.name}</div>
              <div className="text-xs font-mono text-teal-300">Login ID: {kid.handle}</div>
              {kid.teamName && <div className="text-xs font-mono text-slate-500">Team: {kid.teamName}</div>}
            </div>
          </div>
          <label className="text-xs font-mono text-slate-400 block mb-1">Photo</label>
          <input type="file" accept="image/*" onChange={(e) => pickAvatar(kid.id, e.target.files[0])}
            className="text-xs text-slate-400 mb-3 block w-full file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-slate-700 file:text-slate-200 file:text-xs" />
          <label className="text-xs font-mono text-slate-400 block mb-1">New PIN for {kid.name} (leave blank to keep current)</label>
          <input value={kidPins[kid.id] || ""} onChange={(e) => setKidPins({ ...kidPins, [kid.id]: e.target.value })} placeholder="••••"
            className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm w-full outline-none focus:border-teal-300" />
        </div>
      ))}
      <button onClick={save} className="bg-amber-500 hover:bg-amber-400 text-slate-900 font-semibold rounded py-2 text-sm">
        Save settings
      </button>
      <div className="border-t border-slate-700/50 pt-4">
        <label className="text-xs font-mono text-slate-400 block mb-1">Add a kid</label>
        <div className="flex gap-2">
          <input value={newKidName} onChange={(e) => setNewKidName(e.target.value)} placeholder="Name"
            onKeyDown={(e) => e.key === "Enter" && addKid()}
            className="bg-slate-800 border border-slate-600 rounded px-2 py-1.5 text-sm flex-1 outline-none focus:border-teal-300" />
          <button onClick={addKid} className="bg-teal-400 text-slate-900 font-semibold rounded px-3 text-sm">Add</button>
        </div>
      </div>
    </Panel>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
